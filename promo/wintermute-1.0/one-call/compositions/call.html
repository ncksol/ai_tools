          <path d="M-56,-30 C-62,-78 -6,-104 40,-86 C66,-100 98,-70 92,-28 C100,-6 94,14 88,30 C82,4 72,-16 58,-22 C44,-8 16,-26 -6,-34 C-22,-22 -42,-24 -56,-30 Z" fill="#0a0c0f" />

      <svg width="420" height="500" style="left: 380px; top: 226px"><polyline points="20,0 110,100 80,120 220,260 190,280 372,474" fill="none" stroke="#0a0c0f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><polyline points="20,0 110,100 80,120 220,260 190,280 372,474" fill="none" stroke="#58cfc2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /></svg>

      <svg width="140" height="200" style="left: 150px; top: 96px"><path d="M10,0 L70,0 L120,150 Z" fill="#fbfaf6" /><path d="M10,0 L120,150 L70,0" fill="none" stroke="#0a0c0f" stroke-width="4" stroke-linejoin="round" /></svg>

  <script>
    (function () {
      // A payphone handset in side view: earpiece cup at the top, curved grip, mouthpiece angled forward.
      // Local frame: earpiece face at x=54, cord leaves the grip at CORD_AT. About 300 units tall.
      const HANDSET_D =
        "M46 -42 Q54 -42 54 -34 L54 34 Q54 42 46 42 L22 36 C8 92 6 140 22 188 L50 180 Q57 178 60 184 L92 238 Q95 245 88 249 C62 262 30 263 8 250 C-16 202 -24 112 -12 40 C-19 18 -17 -16 1 -30 Z";
      const CORD_AT = [6, 254];
      const HANDSET = (o) => {
        const fill = o.fill || "#0a0c0f";
        const line = o.line || null;
        const lw = o.lw || 4;
        const t = 'translate(' + o.x + " " + o.y + ") rotate(" + (o.rot || 0) + ") scale(" + (o.flip ? -(o.s || 1) : o.s || 1) + " " + (o.s || 1) + ")";
        const grille = o.grille || line || "#3a424d";
        return (
          '<g transform="' + t + '">' +
          '<path d="' + HANDSET_D + '" fill="' + fill + '"' + (line ? ' stroke="' + line + '" stroke-width="' + lw + '" stroke-linejoin="round"' : "") + "/>" +
          '<path d="M50 -30 V30 M57 191 L85 238" stroke="' + grille + '" stroke-width="' + lw * 0.9 + '" stroke-linecap="round" opacity="0.8"/>' +
          "</g>"
        );
      };
      // Where a point in handset-local coordinates lands after HANDSET's transform.
      const HS_POINT = (o, p) => {
        const s = o.s || 1;
        const a = ((o.rot || 0) * Math.PI) / 180;
        const px = (o.flip ? -1 : 1) * p[0] * s;
        const py = p[1] * s;
        return [o.x + px * Math.cos(a) - py * Math.sin(a), o.y + px * Math.sin(a) + py * Math.cos(a)];
      };
      // A coiled phone cord along a sagging curve from (x1,y1) to (x2,y2), control point (cx,cy).
      const COIL = (x1, y1, cx, cy, x2, y2, loops, amp) => {
        const n = Math.max(80, loops * 14);
        let d = "";
        for (let i = 0; i <= n; i++) {
          const s = i / n;
          const bx = (1 - s) * (1 - s) * x1 + 2 * (1 - s) * s * cx + s * s * x2;
          const by = (1 - s) * (1 - s) * y1 + 2 * (1 - s) * s * cy + s * s * y2;
          let tx = 2 * (1 - s) * (cx - x1) + 2 * s * (x2 - cx);
          let ty = 2 * (1 - s) * (cy - y1) + 2 * s * (y2 - cy);
          const L = Math.hypot(tx, ty) || 1;
          tx /= L;
          ty /= L;
          const ph = 2 * Math.PI * loops * s;
          const ends = Math.min(1, s * 12, (1 - s) * 12);
          const x = bx + ends * (-ty * amp * Math.sin(ph) + tx * amp * 0.55 * Math.cos(ph));
          const y = by + ends * (tx * amp * Math.sin(ph) + ty * amp * 0.55 * Math.cos(ph));
          d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
        }
        return d;
      };
      // A rotary desk phone with its handset in the cradle; base centred on (x, y) = bottom middle.
      const DESK_HS = (x, y, k) => ({ x: x + 95 * k, y: y - 152 * k, rot: 90, s: 0.86 * k, fill: "#0a0c0f", line: "#3a424d", lw: 3 / (0.86 * k), grille: "#3a424d" });
      const DESKPHONE = (x, y, k, withHandset) => {
        const P = (px, py) => (x + px * k).toFixed(1) + " " + (y + py * k).toFixed(1);
        let s =
          '<path d="M' + P(-110, 0) + " L" + P(-84, -78) + " Q" + P(-80, -88) + " " + P(-68, -88) + " L" + P(68, -88) + " Q" + P(80, -88) + " " + P(84, -78) + " L" + P(110, 0) + ' Z" fill="#1c2128" stroke="#0a0c0f" stroke-width="' + 4 * k + '"/>' +
          '<circle cx="' + (x).toFixed(1) + '" cy="' + (y - 44 * k).toFixed(1) + '" r="' + (30 * k).toFixed(1) + '" fill="#3a424d" stroke="#0a0c0f" stroke-width="' + 3 * k + '"/>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + (y - 44 * k).toFixed(1) + '" r="' + (10 * k).toFixed(1) + '" fill="#0a0c0f"/>' +
          '<path d="M' + P(-92, -86) + " L" + P(-88, -106) + " M" + P(92, -86) + " L" + P(88, -106) + '" stroke="#0a0c0f" stroke-width="' + 12 * k + '" stroke-linecap="round"/>';
        if (withHandset) s += HANDSET(DESK_HS(x, y, k));
        return s;
      };
      const NS = "http://www.w3.org/2000/svg";
      // Six pieces of the job, one per member of the crew.
      const cards = [
        ["THE SAFE", 520, 270, -4],
        ["THE PAPERS", 1380, 260, 3],
        ["THE BLUEPRINTS", 420, 590, 2],
        ["THE ROUTE", 1430, 620, -3],
        ["THE 2ND FLOOR", 680, 880, 3],
        ["THE APPRAISAL", 1250, 885, -2],
      ];
      const cg = document.getElementById("cl-cards");
      const sg = document.getElementById("cl-strings");
      cards.forEach(([label, x, y, r], i) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("id", "cl-c" + i);
        g.innerHTML =
          '<g transform="rotate(' + r + " " + x + " " + y + ')">' +
          '<rect x="' + (x - 170) + '" y="' + (y - 70) + '" width="340" height="140" fill="#ece8df" stroke="#0a0c0f" stroke-width="5"/>' +
          '<path d="M' + (x - 150) + " " + (y - 34) + " H" + (x + 150) + '" stroke="#b3262e" stroke-width="3" opacity="0.6"/>' +
          '<text class="tw" x="' + x + '" y="' + (y + 22) + '" text-anchor="middle" font-size="36" fill="#0a0c0f">' + label + "</text>" +
          '<circle cx="' + x + '" cy="' + (y - 52) + '" r="11" fill="#3a424d" stroke="#0a0c0f" stroke-width="4"/></g>';
        cg.appendChild(g);
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("id", "cl-s" + i);
        ln.setAttribute("x1", 960);
        ln.setAttribute("y1", 452);
        ln.setAttribute("x2", x);
        ln.setAttribute("y2", y - 52);
        const len = Math.hypot(x - 960, y - 52 - 452);
        ln.setAttribute("stroke-dasharray", len + " " + (len + 10));
        ln.setAttribute("stroke-dashoffset", 0);
        sg.appendChild(ln);
      });
      // The Voice: a payphone handset hanging on its coiled cord.
      const HS = { x: 1736.6, y: 799, rot: 180, s: 1.1, fill: "#0a0c0f", line: "#58cfc2", grille: "#58cfc2", lw: 4 };
      document.getElementById("cl-handset").innerHTML = HANDSET(HS);
      const at = HS_POINT(HS, CORD_AT);
      const d = COIL(at[0], -720, at[0] + 8, (at[1] + -720) / 2, at[0], at[1], 44, 13);
      document.getElementById("cl-cord").setAttribute("d", d);
      // The client holds a handset to his ear; its cord runs down to the desk phone.
      const CH = { x: 61, y: 24, rot: 44, s: 0.48, flip: true, fill: "#0a0c0f", grille: "#3a424d" };
      document.getElementById("cl-hs").innerHTML = HANDSET(CH);
      const cp = HS_POINT(CH, CORD_AT);
      document.getElementById("cl-phonecord").setAttribute("d", COIL(1388 + 1.42 * cp[0], 452 + 1.42 * cp[1], 1400, 880, 1572, 800, 16, 9));
      document.getElementById("cl-deskphone").innerHTML = DESKPHONE(1640, 830, 0.75, false);
      document.getElementById("cl-cord-rim").setAttribute("d", d);
    })();

    const tl = gsap.timeline({ paused: true });
    const speech = [[0.7, 3.4]];
    const wave = { t: 0 };
    const drawWave = () => {
      const t = wave.t;
      let a = 0.06;
      speech.forEach(([s, e]) => {
        if (t > s - 0.15 && t < e + 0.25) a = Math.max(a, Math.min(1, (t - s + 0.15) / 0.15, (e + 0.25 - t) / 0.25));
      });
      let d = "";
      for (let i = 0; i <= 140; i++) {
        const x = 1150 + i * 5;
        const env = Math.sin((i / 140) * Math.PI);
        const y = 990 + a * 70 * env * Math.sin(i * 0.55 + t * 21) * Math.sin(i * 0.13 - t * 7.3) + 3 * Math.sin(i * 0.9 + t * 11);
        d += (i ? " L" : "M") + x + " " + y.toFixed(1);
      }
      document.getElementById("cl-wave").setAttribute("d", d);
    };
    tl.fromTo(wave, { t: 7.5 }, { t: 14, duration: 6.5, ease: "none", onUpdate: drawWave }, 0);

    // The page splits: the Voice's wall shrinks into the left panel, the client's room opens on the right.
    tl.fromTo("#cl-artwrap", { x: 0, y: 0, scale: 1, transformOrigin: "0px 0px" }, { x: -140, y: 300, scale: 0.58, duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-left", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 969px 0px 0px)", duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-right", { clipPath: "inset(0px 0px 0px 1920px)" }, { clipPath: "inset(0px 0px 0px 969px)", duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-ring", { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.18, ease: "expo.out" }, 0.1);
    tl.to("#cl-ring", { opacity: 0, duration: 0.12, ease: "power3.in" }, 0.62);

    tl.fromTo("#cl-b1", { opacity: 0, scale: 0.86, transformOrigin: "80% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0.7);
    tl.to("#cl-b1", { opacity: 0, duration: 0.15, ease: "power3.in" }, 3.75);
    tl.fromTo("#cl-b2", { opacity: 0, scale: 0.86, transformOrigin: "60% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 3.75);
    window.__timelines["call"] = tl;
  </script>
