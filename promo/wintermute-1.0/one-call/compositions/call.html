  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      // Six pieces of the job, one per member of the crew.
      const cards = [
        ["THE SAFE", 520, 270, -4],
        ["THE PAPERS", 1380, 260, 3],
        ["THE BLUEPRINTS", 420, 590, 2],
        ["THE ROUTE", 1490, 610, -3],
        ["THE 2ND FLOOR", 680, 880, 3],
        ["THE APPRAISAL", 1250, 885, -2],
      ];
      const cg = document.getElementById("cl-cards");
      const sg = document.getElementById("cl-strings");
      cards.forEach(([label, x, y, r], i) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("id", "cl-c" + i);
        g.innerHTML =
          '<g transform="rotate(' + r + " " + x + " " + y + ')">' +
          '<rect x="' + (x - 170) + '" y="' + (y - 70) + '" width="340" height="140" fill="#ece8df" stroke="#0a0c0f" stroke-width="5"/>' +
          '<path d="M' + (x - 150) + " " + (y - 34) + " H" + (x + 150) + '" stroke="#b3262e" stroke-width="3" opacity="0.6"/>' +
          '<text class="tw" x="' + x + '" y="' + (y + 22) + '" text-anchor="middle" font-size="36" fill="#0a0c0f">' + label + "</text>" +
          '<circle cx="' + x + '" cy="' + (y - 52) + '" r="11" fill="#3a424d" stroke="#0a0c0f" stroke-width="4"/></g>';
        cg.appendChild(g);
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("id", "cl-s" + i);
        ln.setAttribute("x1", 960);
        ln.setAttribute("y1", 452);
        ln.setAttribute("x2", x);
        ln.setAttribute("y2", y - 52);
        const len = Math.hypot(x - 960, y - 52 - 452);
        ln.setAttribute("stroke-dasharray", len + " " + (len + 10));
        ln.setAttribute("stroke-dashoffset", 0);
        sg.appendChild(ln);
      });
      // Coiled cord from the top edge down to the handset.
      let d = "";
      for (let i = 0; i <= 551; i++) {
        const th = i * 0.38;
        const x = 1730 + 26 * Math.sin(th);
        const y = -660 + i * 2.2 + 12 * Math.cos(th);
        d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      document.getElementById("cl-cord").setAttribute("d", d);
      document.getElementById("cl-cord-rim").setAttribute("d", d);
    })();

    const tl = gsap.timeline({ paused: true });
    const speech = [[0.7, 3.4]];
    const wave = { t: 0 };
    const drawWave = () => {
      const t = wave.t;
      let a = 0.06;
      speech.forEach(([s, e]) => {
        if (t > s - 0.15 && t < e + 0.25) a = Math.max(a, Math.min(1, (t - s + 0.15) / 0.15, (e + 0.25 - t) / 0.25));
      });
      let d = "";
      for (let i = 0; i <= 140; i++) {
        const x = 1150 + i * 5;
        const env = Math.sin((i / 140) * Math.PI);
        const y = 990 + a * 70 * env * Math.sin(i * 0.55 + t * 21) * Math.sin(i * 0.13 - t * 7.3) + 3 * Math.sin(i * 0.9 + t * 11);
        d += (i ? " L" : "M") + x + " " + y.toFixed(1);
      }
      document.getElementById("cl-wave").setAttribute("d", d);
    };
    tl.fromTo(wave, { t: 7.5 }, { t: 14, duration: 6.5, ease: "none", onUpdate: drawWave }, 0);

    // The page splits: the Voice's wall shrinks into the left panel, the client's room opens on the right.
    tl.fromTo("#cl-artwrap", { x: 0, y: 0, scale: 1, transformOrigin: "0px 0px" }, { x: -140, y: 300, scale: 0.58, duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-left", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 969px 0px 0px)", duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-right", { clipPath: "inset(0px 0px 0px 1920px)" }, { clipPath: "inset(0px 0px 0px 969px)", duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-ring", { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.18, ease: "expo.out" }, 0.1);
    tl.to("#cl-ring", { opacity: 0, duration: 0.12, ease: "power3.in" }, 0.62);

    tl.fromTo("#cl-b1", { opacity: 0, scale: 0.86, transformOrigin: "80% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0.7);
    tl.to("#cl-b1", { opacity: 0, duration: 0.15, ease: "power3.in" }, 3.75);
    tl.fromTo("#cl-b2", { opacity: 0, scale: 0.86, transformOrigin: "60% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 3.75);
    window.__timelines["call"] = tl;
  </script>
