          <stop offset="0" stop-color="#c9ccd1" stop-opacity="0.34" />

      <path d="M880 -700 V54" stroke="#0a0c0f" stroke-width="6" />
      <path d="M826 96 Q880 40 934 96 Z" fill="#0a0c0f" />
      <ellipse cx="880" cy="98" rx="20" ry="8" fill="#ece8df" />

      <g id="cl-cards"></g>
      <g id="cl-folder" data-layout-allow-overlap>
        <rect x="770" y="420" width="140" height="40" rx="6" fill="#d9d2c1" stroke="#0a0c0f" stroke-width="5" />
        <rect x="770" y="445" width="380" height="256" rx="6" fill="#e2dccd" stroke="#0a0c0f" stroke-width="6" />
        <path d="M800 480 H1080 M800 506 H1010" stroke="#8a929c" stroke-width="5" />
        <g transform="rotate(-7 960 590)">
          <rect x="818" y="540" width="284" height="100" fill="none" stroke="#b3262e" stroke-width="8" />

      </g>
      <!-- The Voice: a coiled cord and a dangling handset, never a body -->
      <g id="cl-voice">
        <path id="cl-cord-rim" fill="none" stroke="#58cfc2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
        <path id="cl-cord" fill="none" stroke="#0a0c0f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <g id="cl-handset">
        </g>
      </g>

    </svg>
      </div>
    </div>

    <!-- The client's desk at home, 2 a.m. (drawn by DESK_SCENE) -->

    <div id="cl-ring" class="sfx" style="left: 1560px; top: 640px; font-size: 92px">RRRING!</div>
    <div id="cl-b1" class="bal voice" style="left: 70px; top: 56px">
      Four people.<br />Here's the plan.<br />Yes?
      <svg width="420" height="500" style="left: 380px; top: 226px"><polyline points="20,0 110,100 80,120 220,260 190,280 372,474" fill="none" stroke="#0a0c0f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><polyline points="20,0 110,100 80,120 220,260 190,280 372,474" fill="none" stroke="#58cfc2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /></svg>
    </div>
    <div id="cl-b2" class="bal" style="left: 1240px; top: 200px">
      Yes.
      <svg width="220" height="200" style="left: 60px; top: 96px"><path d="M10,0 L70,0 L172,156 Z" fill="#fbfaf6" /><path d="M10,0 L172,156 L70,0" fill="none" stroke="#0a0c0f" stroke-width="4" stroke-linejoin="round" /></svg>
    </div>
  </div>
  <script>
    (function () {
      const { HANDSET_D, CORD_AT, HANDSET, HS_POINT, COIL, DESK_HS, DESKPHONE, INK, st, C_HEAD, C_FIST, LIMBS, CUFF, C_TORSO, C_PHONE, C_SLEEP, C_STAND, PROPS, CREW, GLOVE, HAT, FIG_HS, C_PHONE_HS, C_AT, C_EAR, C_MOUTH, DESK_SCENE, JOB_ON_DESK, SKIN, SKIN_D, SHIRT, SHIRT_D, TIE, TROUSER } = window.OC;
      const NS = "http://www.w3.org/2000/svg";
      // Six pieces of the job, one per member of the crew.
      const cards = [
        ["THE SAFE", 560, 290, -4],
        ["THE PAPERS", 1340, 280, 3],
        ["THE BLUEPRINTS", 560, 800, 2],
        ["THE ROUTE", 1300, 810, -3],
      ];
      const cg = document.getElementById("cl-cards");
      const sg = document.getElementById("cl-strings");
      cards.forEach(([label, x, y, r], i) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("id", "cl-c" + i);
        g.innerHTML =
          '<g transform="rotate(' + r + " " + x + " " + y + ')">' +
          '<rect x="' + (x - 170) + '" y="' + (y - 70) + '" width="340" height="140" fill="#ece8df" stroke="#0a0c0f" stroke-width="5"/>' +
          '<path d="M' + (x - 150) + " " + (y - 34) + " H" + (x + 150) + '" stroke="#b3262e" stroke-width="3" opacity="0.6"/>' +
          '<text class="tw" x="' + x + '" y="' + (y + 22) + '" text-anchor="middle" font-size="36" fill="#0a0c0f">' + label + "</text>" +
          '<circle cx="' + x + '" cy="' + (y - 52) + '" r="11" fill="#3a424d" stroke="#0a0c0f" stroke-width="4"/></g>';
        cg.appendChild(g);
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("id", "cl-s" + i);
        ln.setAttribute("x1", 960);
        ln.setAttribute("y1", 452);
        ln.setAttribute("x2", x);
        ln.setAttribute("y2", y - 52);
        const len = Math.hypot(x - 960, y - 52 - 452);
        ln.setAttribute("stroke-dasharray", len + " " + (len + 10));
        ln.setAttribute("stroke-dashoffset", 0);
        sg.appendChild(ln);
      });
      // The Voice: a payphone handset hanging on its coiled cord.
      const HS = { x: 1736.6, y: 799, rot: 180, s: 1.1, fill: "#0a0c0f", line: "#58cfc2", grille: "#58cfc2", lw: 4 };
      document.getElementById("cl-handset").innerHTML = HANDSET(HS);
      const at = HS_POINT(HS, CORD_AT);
      const d = COIL(at[0], -720, at[0] + 8, (at[1] + -720) / 2, at[0], at[1], 44, 13);
      document.getElementById("cl-cord").setAttribute("d", d);
      document.getElementById("cl-rart").innerHTML = DESK_SCENE({ x0: 960, cx: 1470, s: 1.45, wx: 1100, lampX: 1760, phoneX: 1150, mugX: 1000, eye: "open", phoneId: "cl-deskphone" });
      document.getElementById("cl-cord-rim").setAttribute("d", d);
    })();

    const tl = gsap.timeline({ paused: true });
    const speech = [[0.7, 3.4]];
    const wave = { t: 0 };
    const drawWave = () => {
      const t = wave.t;
      let a = 0.06;
      speech.forEach(([s, e]) => {
        if (t > s - 0.15 && t < e + 0.25) a = Math.max(a, Math.min(1, (t - s + 0.15) / 0.15, (e + 0.25 - t) / 0.25));
      });
      let d = "";
      for (let i = 0; i <= 140; i++) {
        const x = 1150 + i * 5;
        const env = Math.sin((i / 140) * Math.PI);
        const y = 990 + a * 70 * env * Math.sin(i * 0.55 + t * 21) * Math.sin(i * 0.13 - t * 7.3) + 3 * Math.sin(i * 0.9 + t * 11);
        d += (i ? " L" : "M") + x + " " + y.toFixed(1);
      }
      document.getElementById("cl-wave").setAttribute("d", d);
    };
    tl.fromTo(wave, { t: 7.5 }, { t: 14, duration: 6.5, ease: "none", onUpdate: drawWave }, 0);

    // The page splits: the Voice's wall shrinks into the left panel, the client's room opens on the right.
    tl.fromTo("#cl-artwrap", { x: 0, y: 0, scale: 1, transformOrigin: "0px 0px" }, { x: -140, y: 300, scale: 0.58, duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-left", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 969px 0px 0px)", duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-right", { clipPath: "inset(0px 0px 0px 1920px)" }, { clipPath: "inset(0px 0px 0px 969px)", duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#cl-ring", { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.18, ease: "expo.out" }, 0.1);
    tl.to("#cl-ring", { opacity: 0, duration: 0.12, ease: "power3.in" }, 0.62);

    tl.fromTo("#cl-b1", { opacity: 0, scale: 0.86, transformOrigin: "80% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0.7);
    tl.to("#cl-b1", { opacity: 0, duration: 0.15, ease: "power3.in" }, 3.75);
    tl.fromTo("#cl-b2", { opacity: 0, scale: 0.86, transformOrigin: "60% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 3.75);
    window.__timelines["call"] = tl;
  </script>
