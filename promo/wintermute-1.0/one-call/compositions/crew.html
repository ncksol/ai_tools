<template>
  <style>
    @font-face { font-family: "Special Elite"; src: url("assets/fonts/special-elite-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Patrick Hand"; src: url("assets/fonts/patrick-hand-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Bangers"; src: url("assets/fonts/bangers-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--color-paper, #ece8df); }
    #root .cap { position: absolute; z-index: 30; background: var(--color-paper, #ece8df); color: var(--color-ink, #0a0c0f); font-family: "Special Elite", monospace; font-size: 34px; line-height: 1.25; padding: 12px 22px 10px; border: 3px solid var(--color-ink, #0a0c0f); box-shadow: 7px 7px 0 rgba(0, 0, 0, 0.6); white-space: nowrap; clip-path: inset(-30% 100% -30% -6%); }
    #root .cap.big { font-size: 40px; padding: 16px 30px 14px; }
    #root .bal { position: absolute; z-index: 32; font-family: "Patrick Hand", sans-serif; text-transform: uppercase; font-size: 52px; line-height: 1.05; padding: 22px 38px 18px; border: 4px solid; border-radius: 48px; white-space: nowrap; opacity: 0; }
    #root .bal.voice { background: var(--color-ink, #0a0c0f); color: var(--color-neon, #58cfc2); border-color: var(--color-neon, #58cfc2); }
    #root .bal svg { position: absolute; overflow: visible; }
    #root .sfx { position: absolute; z-index: 25; font-family: "Bangers", sans-serif; color: var(--color-paper, #ece8df); -webkit-text-stroke: 7px var(--color-ink, #0a0c0f); paint-order: stroke fill; letter-spacing: 0.04em; white-space: nowrap; line-height: 1; opacity: 0; }
    #root .pnl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #root .art { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #c3-dip { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 40; }
    #c3-p2 { clip-path: inset(0px 0px 0px 1920px); }
    #c3-p3 { clip-path: inset(1080px 969px 0px 0px); }
    #c3-p4 { clip-path: inset(1080px 0px 0px 969px); }
  </style>
  <div id="root" data-composition-id="crew" data-width="1920" data-height="1080">
    <div id="c3-p1" class="pnl"><svg id="c3-a1" class="art" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div>
    <div id="c3-p2" class="pnl"><svg id="c3-a2" class="art" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div>
    <div id="c3-p3" class="pnl"><svg id="c3-a3" class="art" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div>
    <div id="c3-p4" class="pnl"><svg id="c3-a4" class="art" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div>

    <div id="c3-r1" class="sfx" style="left: 560px; top: 80px; font-size: 110px">RRRING!</div>
    <div id="c3-r2" class="sfx" style="left: 1240px; top: 150px; font-size: 90px">RRRING!</div>
    <div id="c3-r3" class="sfx" style="left: 250px; top: 600px; font-size: 64px">RRRING!</div>
    <div id="c3-r4" class="sfx" style="left: 1220px; top: 600px; font-size: 64px">RRRING!</div>

    <div id="c3-b1" class="bal voice" style="left: 1000px; top: 70px">
      It's all in the envelope.
      <svg width="320" height="260" style="left: 10px; top: 92px"><polyline points="40,0 -10,60 22,74 -80,150 -50,160 -200,230" fill="none" stroke="#58cfc2" stroke-width="5" stroke-linejoin="round" /></svg>
    </div>

    <div id="c3-k1" class="cap" style="left: 60px; top: 960px">THE SAFECRACKER</div>
    <div id="c3-k2" class="cap" style="left: 1029px; top: 960px">THE FORGER &middot; documents</div>
    <div id="c3-k3" class="cap" style="left: 30px; top: 1000px">THE LIBRARIAN &middot; research</div>
    <div id="c3-k4" class="cap" style="left: 999px; top: 1000px">THE DRIVER &middot; tests</div>
    <div id="c3-dip"></div>
    <div id="c3-met" class="cap big" style="left: 706px; top: 506px">They have never met.</div>
  </div>
  <script>
    (function () {
      // Noir figure, feet at (0,0), facing right, about 400 units tall.
      const FIG = (o) => {
        const f = o.fill || "#0a0c0f";
        const ln = o.line || null;
        const st = ln ? ' stroke="' + ln + '" stroke-width="4" stroke-linejoin="round"' : "";
        const hats = {
          fedora: '<ellipse cx="2" cy="-352" rx="50" ry="9"/><path d="M-28,-352 C-28,-388 -18,-396 2,-396 C22,-396 32,-388 32,-352 Z"/>',
          bowler: '<ellipse cx="2" cy="-352" rx="40" ry="7"/><path d="M-27,-352 C-27,-404 31,-404 31,-352 Z"/>',
          cap: '<path d="M-26,-348 C-26,-382 22,-386 44,-356 L60,-348 Z"/>',
        };
        const arms = {
          phone: "M32,-290 Q80,-262 48,-318",
          down: "M30,-290 C46,-240 50,-190 46,-150",
          hold: "M30,-290 Q60,-236 96,-220",
          reach: "M30,-290 Q86,-262 132,-236",
          point: "M30,-292 Q90,-300 132,-322",
        };
        const armD = arms[o.arm || "down"];
        const arm = (ln ? '<path d="' + armD + '" fill="none" stroke="' + ln + '" stroke-width="34" stroke-linecap="round"/>' : "") + '<path d="' + armD + '" fill="none" stroke="' + f + '" stroke-width="26" stroke-linecap="round"/>';
        const handset = o.arm === "phone" ? '<path d="M16,-364 C6,-350 8,-316 28,-300 L42,-310 C28,-322 24,-348 30,-362 Z" fill="#0a0c0f"/>' : "";
        const band = ln ? '<rect x="-27" y="-366" width="58" height="10" fill="#0a0c0f" stroke="none"/>' : "";
        const rim = o.rim ? '<path d="M-48,-300 C-60,-250 -64,-170 -68,-96 M-28,-352 C-28,-388 -18,-396 2,-396" fill="none" stroke="' + o.rim + '" stroke-width="4" stroke-linecap="round"/>' : "";
        return (
          '<g fill="' + f + '"' + st + ">" +
          '<path d="M-34,-100 L-10,-100 L-8,-10 L-32,-10 Z M8,-100 L32,-100 L34,-10 L10,-10 Z"/>' +
          '<path d="M-38,-12 L-4,-12 L4,0 L-38,0 Z M8,-12 L40,-12 L52,0 L8,0 Z"/>' +
          '<path d="M-48,-300 C-60,-250 -64,-170 -68,-96 L68,-96 C64,-170 60,-250 48,-300 C30,-312 -30,-312 -48,-300 Z"/>' +
          '<path d="M-32,-300 L-22,-334 L2,-318 L24,-334 L36,-300 Z"/>' +
          '<circle cx="2" cy="-334" r="23"/>' + (hats[o.hat || "fedora"]) + band + "</g>" + arm + handset + rim
        );
      };
      // Glass payphone booth, base at (bx, b), scale k; the panes can light teal.
      const BOOTH = (bx, b, k, litId) => {
        const r = (x, y, w, h, extra) => '<rect x="' + (bx + x * k) + '" y="' + (b + y * k) + '" width="' + w * k + '" height="' + h * k + '" ' + extra + "/>";
        return {
          back:
            r(-78, -306, 156, 306, 'rx="4" fill="#1c2128" stroke="#0a0c0f" stroke-width="' + 3 * k + '"') +
            r(-64, -284, 128, 266, 'fill="#2b313a"') +
            r(-64, -284, 128, 266, 'id="' + litId + '" fill="#58cfc2" opacity="0"') +
            r(14, -250, 40, 64, 'rx="4" fill="#0a0c0f"') +
            r(20, -228, 28, 4, 'fill="#3a424d"'),
          front:
            r(-4, -284, 8, 266, 'fill="#1c2128"') +
            r(-64, -196, 128, 8, 'fill="#1c2128"') +
            r(-64, -104, 128, 8, 'fill="#1c2128"') +
            r(-86, -328, 172, 30, 'rx="4" fill="#0a0c0f"') +
            r(-48, -322, 96, 16, 'fill="#c9ccd1" opacity="0.8"'),
        };
      };
      let seed = 11;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
      const store = (inner) =>
        '<rect x="1040" y="260" width="580" height="600" fill="#1c2128" stroke="#0a0c0f" stroke-width="8"/>' +
        '<rect x="1068" y="288" width="524" height="544" fill="#262c34"/>' + inner +
        '<rect x="1020" y="236" width="620" height="36" fill="#0a0c0f"/>';
      const props = [
        // Safecracker: a bank vault door behind the glass.
        store(
          '<circle cx="1330" cy="560" r="228" fill="#3a424d" stroke="#0a0c0f" stroke-width="8"/>' +
          '<circle cx="1330" cy="560" r="176" fill="none" stroke="#2b313a" stroke-width="12"/>' +
          '<g stroke="#0a0c0f" stroke-width="16" stroke-linecap="round"><path d="M1330 420 V700 M1190 560 H1470 M1231 461 L1429 659 M1429 461 L1231 659"/></g>' +
          '<circle cx="1330" cy="560" r="46" fill="#5b6470" stroke="#0a0c0f" stroke-width="6"/>' +
          '<g fill="#c9ccd1"><circle cx="1330" cy="352" r="7"/><circle cx="1330" cy="768" r="7"/><circle cx="1122" cy="560" r="7"/><circle cx="1538" cy="560" r="7"/></g>'
        ),
        // Forger: a print shop, paper stacks and a giant rubber stamp.
        store(
          '<rect x="1110" y="700" width="200" height="130" fill="#d9d2c1" stroke="#0a0c0f" stroke-width="5"/>' +
          '<path d="M1110 726 H1310 M1110 752 H1310 M1110 778 H1310 M1110 804 H1310" stroke="#8a929c" stroke-width="4"/>' +
          '<rect x="1350" y="640" width="200" height="60" rx="6" fill="#0a0c0f"/>' +
          '<rect x="1426" y="500" width="48" height="146" fill="#3a424d" stroke="#0a0c0f" stroke-width="5"/>' +
          '<ellipse cx="1450" cy="486" rx="70" ry="44" fill="#5b6470" stroke="#0a0c0f" stroke-width="6"/>' +
          '<rect x="1330" y="770" width="240" height="60" fill="#ece8df" stroke="#0a0c0f" stroke-width="5"/>' +
          '<path d="M1110 330 H1560" stroke="#0a0c0f" stroke-width="4"/>' +
          '<rect x="1140" y="330" width="80" height="110" fill="#ece8df" stroke="#0a0c0f" stroke-width="4"/><rect x="1260" y="330" width="80" height="110" fill="#ece8df" stroke="#0a0c0f" stroke-width="4"/><rect x="1380" y="330" width="80" height="110" fill="#ece8df" stroke="#0a0c0f" stroke-width="4"/>'
        ),
        // Librarian: shelves of books.
        (() => {
          let b = "";
          [380, 520, 660, 800].forEach((shelf) => {
            let x = 1080;
            while (x < 1570) {
              const w = 18 + rnd() * 26;
              const h = 80 + rnd() * 40;
              const shade = ["#3a424d", "#5b6470", "#2b313a", "#8a929c", "#c9ccd1"][Math.floor(rnd() * 5)];
              b += '<rect x="' + x.toFixed(0) + '" y="' + (shelf - h).toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) + '" fill="' + shade + '" stroke="#0a0c0f" stroke-width="3"/>';
              x += w + 2;
            }
            b += '<rect x="1068" y="' + shelf + '" width="524" height="14" fill="#0a0c0f"/>';
          });
          return store(b);
        })(),
        // Driver: a parked car, headlights on.
        '<polygon points="1650,792 1920,700 1920,900 1650,822" fill="#ece8df" opacity="0.16"/>' +
          '<path d="M1060,870 L1078,778 L1196,762 L1268,688 L1460,680 L1540,756 L1648,776 L1664,870 Z" fill="#1c2128" stroke="#0a0c0f" stroke-width="8" stroke-linejoin="round"/>' +
          '<path d="M1290,704 L1446,698 L1500,760 L1250,764 Z" fill="#2b313a" stroke="#0a0c0f" stroke-width="5"/>' +
          '<path d="M1376 700 V762" stroke="#0a0c0f" stroke-width="6"/>' +
          '<rect x="1634" y="790" width="24" height="26" fill="#ece8df"/>' +
          '<circle cx="1180" cy="870" r="50" fill="#0a0c0f"/><circle cx="1180" cy="870" r="18" fill="#5b6470"/>' +
          '<circle cx="1540" cy="870" r="50" fill="#0a0c0f"/><circle cx="1540" cy="870" r="18" fill="#5b6470"/>',
      ];
      for (let i = 1; i <= 4; i++) {
        const b = BOOTH(760, 900, 2.3, "c3-lit" + i);
        const svg = document.getElementById("c3-a" + i);
        svg.innerHTML =
          '<rect x="-1000" y="-800" width="3920" height="1700" fill="#14181d"/>' +
          '<rect x="-1000" y="900" width="3920" height="900" fill="#0b0d10"/>' +
          '<path d="M-1000 960 H2920" stroke="#1c2128" stroke-width="4"/>' +
          props[i - 1] +
          '<g id="c3-bo' + i + '">' + b.back +
          '<g id="c3-fa' + i + '" transform="translate(690 880) scale(1.45)">' + FIG({ arm: "down" }) + "</g>" +
          '<g id="c3-fb' + i + '" opacity="0" transform="translate(690 880) scale(1.45)">' + FIG({ arm: "phone" }) + "</g>" +
          '<path id="c3-cord' + i + '" d="M752 452 C770 480 800 470 812 462" fill="none" stroke="#0a0c0f" stroke-width="5" opacity="0"/>' +
          b.front +
          '<g id="c3-env' + i + '" opacity="0"><g transform="translate(838 470) rotate(-8)">' +
          '<rect x="-60" y="-36" width="120" height="72" fill="#ece8df" stroke="#0a0c0f" stroke-width="4"/>' +
          '<path d="M-60 -36 L0 8 L60 -36" fill="none" stroke="#0a0c0f" stroke-width="4"/>' +
          '<circle cx="0" cy="8" r="13" fill="#58cfc2" stroke="#0a0c0f" stroke-width="3"/></g></g>' +
          "</g>";
      }
    })();

    const tl = gsap.timeline({ paused: true });
    const wipe = (sel, at) => tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -6%)" }, { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.3, ease: "power2.out" }, at);
    const pop = (sel, at, origin) => tl.fromTo(sel, { opacity: 0, scale: 0.86, transformOrigin: origin || "50% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, at);
    const ring = (i, at, pickup, tilt) => {
      tl.fromTo("#c3-lit" + i, { opacity: 0.85 }, { opacity: 0.85, duration: 0.01 }, at);
      tl.fromTo("#c3-bo" + i, { x: 0 }, { x: 3, duration: 0.05, ease: "none", yoyo: true, repeat: Math.round((pickup - at) / 0.05) - 1 }, at);
      tl.fromTo("#c3-r" + i, { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: tilt, duration: 0.18, ease: "expo.out" }, at + 0.05);
      tl.to("#c3-r" + i, { opacity: 0, duration: 0.12, ease: "power3.in" }, pickup - 0.05);
      tl.to("#c3-fa" + i, { opacity: 0, duration: 0.08, ease: "none" }, pickup);
      tl.to("#c3-fb" + i + ", #c3-cord" + i, { opacity: 1, duration: 0.08, ease: "none" }, pickup);
      tl.to("#c3-lit" + i, { opacity: 0.6, duration: 0.3, ease: "power2.out" }, pickup);
      tl.fromTo("#c3-env" + i, { opacity: 0, y: -20 }, { opacity: 1, y: 70, duration: 0.45, ease: "expo.out" }, pickup + 0.35);
    };
    const T = { duration: 0.6, ease: "power3.inOut" };
    const art = (i, x, y, s, at) => tl.to("#c3-a" + i, { x, y, scale: s, transformOrigin: "0px 0px", ...T }, at);
    const clip = (i, v, at) => tl.to("#c3-p" + i, { clipPath: v, ...T }, at);

    // Panel 1: the safecracker picks up.
    ring(1, 0, 0.8, -6);
    wipe("#c3-k1", 0.4);
    pop("#c3-b1", 0.95, "5% 100%");
    tl.to("#c3-b1", { opacity: 0, duration: 0.15, ease: "power3.in" }, 2.85);

    // Split into two: the forger.
    art(1, -225, 135, 0.75, 3.0);
    clip(1, "inset(0px 969px 0px 0px)", 3.0);
    tl.fromTo("#c3-a2", { x: 744, y: 135, scale: 0.75, transformOrigin: "0px 0px" }, { x: 744, y: 135, scale: 0.75, duration: 0.01 }, 0);
    tl.fromTo("#c3-p2", { clipPath: "inset(0px 0px 0px 1920px)" }, { clipPath: "inset(0px 0px 0px 969px)", ...T }, 3.0);
    ring(2, 3.0, 3.65, 5);
    wipe("#c3-k2", 3.45);

    // Split into four: the librarian and the driver.
    art(1, 0, 0, 0.5, 5.0);
    clip(1, "inset(0px 969px 549px 0px)", 5.0);
    art(2, 969, 0, 0.5, 5.0);
    clip(2, "inset(0px 0px 549px 969px)", 5.0);
    tl.to("#c3-k1", { x: -30, y: -522, ...T }, 5.0);
    tl.to("#c3-k2", { x: -30, y: -522, ...T }, 5.0);
    tl.fromTo("#c3-a3", { x: 0, y: 549, scale: 0.5, transformOrigin: "0px 0px" }, { x: 0, y: 549, scale: 0.5, duration: 0.01 }, 0);
    tl.fromTo("#c3-a4", { x: 969, y: 549, scale: 0.5, transformOrigin: "0px 0px" }, { x: 969, y: 549, scale: 0.5, duration: 0.01 }, 0);
    tl.fromTo("#c3-p3", { clipPath: "inset(1080px 969px 0px 0px)" }, { clipPath: "inset(549px 969px 0px 0px)", ...T }, 5.0);
    tl.fromTo("#c3-p4", { clipPath: "inset(1080px 0px 0px 969px)" }, { clipPath: "inset(549px 0px 0px 969px)", ...T }, 5.0);
    ring(3, 5.1, 5.6, -5);
    ring(4, 5.25, 5.8, 6);
    wipe("#c3-k3", 5.7);
    wipe("#c3-k4", 5.9);

    // None of them has met the others.
    wipe("#c3-met", 7.0);
    // Dip cut onto the switchboard.
    tl.to("#c3-dip", { opacity: 0.45, duration: 0.1, ease: "none" }, 9.88);
    window.__timelines["crew"] = tl;
  </script>
</template>
