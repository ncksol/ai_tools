        <rect x="620" y="70" width="680" height="1010" fill="#0b0d10" />

        <rect x="722" y="172" width="476" height="340" rx="4" fill="#21262d" stroke="#0a0c0f" stroke-width="6" />

        <!-- The client: the tired engineer at the W door, the job in his hand -->

          <g id="hk-armdown" opacity="0"></g>
          <g id="hk-armout">

            <g transform="rotate(-7)">

              <text class="lg" x="0" y="34" text-anchor="middle" font-size="88" letter-spacing="4" fill="#b3262e">THE JOB</text>
            </g>
              </g>
            </g>
            <g id="hk-thumb"></g>
          </g>
        </g></g>
      </svg>

    <div id="hk-cap1" class="cap" style="left: 96px; top: 84px">2:00 A.M.</div>
    <div id="hk-cap2" class="cap" style="left: 96px; top: 166px">Too big for one night.</div>
    <div id="hk-cap3" class="cap" style="left: 96px; top: 84px">Every payphone in the city starts ringing.</div>

    <div id="hk-r1" class="sfx" style="left: 880px; top: 470px; font-size: 104px">RRRING!</div>
    <div id="hk-r2" class="sfx" style="left: 1220px; top: 520px; font-size: 84px">RRRING!</div>
    <div id="hk-r3" class="sfx" style="left: 380px; top: 520px; font-size: 84px">RRRING!</div>
    <div id="hk-r4" class="sfx" style="left: 1510px; top: 520px; font-size: 76px">RING!</div>
    <div id="hk-r5" class="sfx" style="left: 90px; top: 545px; font-size: 76px">RING!</div>
    <div id="hk-r6" class="sfx" style="left: 1290px; top: 250px; font-size: 54px">RING!</div>
    <div id="hk-r7" class="sfx" style="left: 560px; top: 280px; font-size: 50px">RING!</div>
    <div id="hk-r8" class="sfx" style="left: 1690px; top: 330px; font-size: 46px">RING!</div>

    <div id="hk-dip"></div>

  <script>
    (function () {
      const { HANDSET_D, CORD_AT, HANDSET, HS_POINT, COIL, DESK_HS, DESKPHONE, INK, st, C_HEAD, C_FIST, LIMBS, CUFF, C_TORSO, C_PHONE, C_SLEEP, C_STAND, PROPS, CREW, GLOVE, HAT, FIG_HS, C_PHONE_HS, C_AT, C_EAR, C_MOUTH, DESK_SCENE, JOB_ON_DESK, SKIN, SKIN_D, SHIRT, SHIRT_D, TIE, TROUSER } = window.OC;
      // Seeded city layout: same buildings and lit windows on every render.
      let seed = 7;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
      const NS = "http://www.w3.org/2000/svg";
      const add = (parent, tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        document.getElementById(parent).appendChild(el);
        return el;
      };
      const skyline = (g, wg, x0, minH, maxH, base, minW, maxW, lit) => {
        let x = x0;
        while (x < 1960) {
          const w = minW + rnd() * (maxW - minW);
          const h = minH + rnd() * (maxH - minH);
          add(g, "rect", { x, y: base - h, width: w, height: h });
          for (let wy = base - h + 26; wy < base - 30; wy += 34) {
            for (let wx = x + 14; wx < x + w - 18; wx += 26) {
              if (rnd() < lit) add(wg, "rect", { x: wx, y: wy, width: 10, height: 16, opacity: (0.25 + rnd() * 0.5).toFixed(2) });
            }
          }
          x += w + 6 + rnd() * 18;
        }
      };
      const ST = C_STAND();
      document.getElementById("hk-body").innerHTML = ST.body;
      document.getElementById("hk-arm").innerHTML = ST.arm;
      document.getElementById("hk-palm").innerHTML = ST.palm;
      document.getElementById("hk-thumb").innerHTML = ST.thumb;
      document.getElementById("hk-armdown").innerHTML =
        LIMBS([[[-8, 156], [14, 316], 30, 25]], SHIRT) + LIMBS([[[14, 316], [30, 452], 20, 16]], SKIN) + CUFF([14, 316], 82, 27) +
        '<g transform="translate(34 486) rotate(84) scale(0.8)">' + C_FIST() + "</g>";
      skyline("hk-far", "hk-far-win", -30, 300, 620, 905, 90, 190, 0.18);
      skyline("hk-mid", "hk-mid-win", -60, 160, 420, 905, 140, 260, 0.12);
      // Street payphones: glass booths whose panes light teal when they ring.
      const booths = [[200, 0.9], [500, 1.0], [800, 0.82], [1040, 1.12], [1330, 0.9], [1600, 1.0], [1830, 0.8]];
      booths.forEach(([bx, k], i) => {
        const b = 905;
        const g = add("hk-booths", "g", { id: "hk-b" + i });
        const r = (x, y, w, h, extra) => '<rect x="' + (bx + x * k) + '" y="' + (b + y * k) + '" width="' + w * k + '" height="' + h * k + '" ' + extra + "/>";
        g.innerHTML =
          r(-78, -306, 156, 306, 'rx="4" fill="#1c2128" stroke="#0a0c0f" stroke-width="7"') +
          r(-64, -284, 128, 266, 'fill="#2b313a"') +
          r(-64, -284, 128, 266, 'class="hk-lit" fill="#58cfc2" opacity="0"') +
          r(-4, -284, 8, 266, 'fill="#1c2128"') +
          r(-64, -196, 128, 8, 'fill="#1c2128"') +
          r(-64, -104, 128, 8, 'fill="#1c2128"') +
          r(14, -250, 40, 64, 'rx="4" fill="#0a0c0f"') +
          HANDSET({ x: bx - 6 * k, y: b - 244 * k, rot: 0, s: 0.24 * k, fill: "#0a0c0f", grille: "#3a424d" }) +
          r(-86, -328, 172, 30, 'rx="4" fill="#0a0c0f"') +
          r(-48, -322, 96, 16, 'fill="#c9ccd1" opacity="0.8"');
      });
    })();

    const tl = gsap.timeline({ paused: true });
    const wipeIn = (sel, at) =>
      tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -6%)" }, { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.32, ease: "power2.out" }, at);
    const out = (sel, at) => tl.to(sel, { opacity: 0, duration: 0.16, ease: "power3.in" }, at);

    // Frame 0 is the thumbnail: door, neon W, the job in hand, "2:00 A.M."
    tl.set("#hk-cam", { y: -1080 }, 0);
    wipeIn("#hk-cap2", 0.45);

    // The engineer lines the job up with the slot and pushes it through.
    tl.fromTo("#hk-client", { x: -50 }, { x: 0, duration: 0.85, ease: "power2.inOut" }, 0.35);
    tl.to("#hk-flap", { scaleY: 0.1, svgOrigin: "960 594", duration: 0.14, ease: "power2.out" }, 1.2);
    tl.to("#hk-folder", { scaleX: 0.9, scaleY: 0.14, transformOrigin: "50% 50%", duration: 0.38, ease: "power3.in" }, 1.24);
    tl.to("#hk-folder", { scaleY: 0.01, opacity: 0, transformOrigin: "50% 50%", duration: 0.12, ease: "power2.in" }, 1.62);
    tl.to("#hk-flap", { scaleY: 1, svgOrigin: "960 594", duration: 0.22, ease: "back.out(2.2)" }, 1.84);
    // Job delivered: his arm drops to his side.
    tl.to("#hk-armout", { opacity: 0, duration: 0.12, ease: "none" }, 1.86);
    tl.to("#hk-armdown", { opacity: 1, duration: 0.12, ease: "none" }, 1.86);
    out("#hk-cap1, #hk-cap2", 2.75);

    // Tilt up from the door to the skyline: every payphone starts ringing.
    tl.to("#hk-cam", { y: 0, duration: 0.85, ease: "power2.inOut" }, 2.9);
    const order = [3, 4, 2, 1, 5, 0, 6];
    order.forEach((b, k) => {
      const t = 3.55 + k * 0.22;
      tl.to("#hk-b" + b + " .hk-lit", { opacity: 0.8, duration: 0.08, ease: "none" }, t);
      tl.fromTo("#hk-b" + b, { x: 0 }, { x: 3, duration: 0.05, ease: "none", yoyo: true, repeat: 23 }, t);
    });
    const rings = ["#hk-r1", "#hk-r2", "#hk-r3", "#hk-r6", "#hk-r4", "#hk-r7", "#hk-r5", "#hk-r8"];
    rings.forEach((r, k) => {
      const t = 3.6 + k * 0.2;
      const tilt = [-7, 6, -4, 8, -6, 5, -8, 4][k];
      tl.fromTo(r, { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: tilt, duration: 0.2, ease: "expo.out" }, t);
      tl.to(r, { rotation: tilt - 4, duration: 0.06, ease: "none", yoyo: true, repeat: 9 }, t + 0.2);
    });
    wipeIn("#hk-cap3", 4.5);

    // Dip cut into the Voice's room.
    tl.to("#hk-dip", { opacity: 0.45, duration: 0.1, ease: "none" }, 7.38);
    window.__timelines["hook"] = tl;
  </script>
