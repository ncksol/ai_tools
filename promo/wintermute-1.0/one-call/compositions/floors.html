  <script>
    (function () {
      // Noir figure, feet at (0,0), facing right, about 400 units tall.
      const FIG = (o) => {
        const f = o.fill || "#0a0c0f";
        const ln = o.line || null;
        const st = ln ? ' stroke="' + ln + '" stroke-width="4" stroke-linejoin="round"' : "";
        const hats = {
          fedora: '<ellipse cx="2" cy="-352" rx="50" ry="9"/><path d="M-28,-352 C-28,-388 -18,-396 2,-396 C22,-396 32,-388 32,-352 Z"/>',
          bowler: '<ellipse cx="2" cy="-352" rx="40" ry="7"/><path d="M-27,-352 C-27,-404 31,-404 31,-352 Z"/>',
          cap: '<path d="M-26,-348 C-26,-382 22,-386 44,-356 L60,-348 Z"/>',
        };
        const arms = {
          phone: "M32,-290 Q80,-262 48,-318",
          down: "M30,-290 C46,-240 50,-190 46,-150",
          hold: "M30,-290 Q60,-236 96,-220",
          reach: "M30,-290 Q86,-262 132,-236",
          point: "M30,-292 Q90,-300 132,-322",
        };
        const armD = arms[o.arm || "down"];
        const arm = (ln ? '<path d="' + armD + '" fill="none" stroke="' + ln + '" stroke-width="34" stroke-linecap="round"/>' : "") + '<path d="' + armD + '" fill="none" stroke="' + f + '" stroke-width="26" stroke-linecap="round"/>';
        const handset = o.arm === "phone" ? '<path d="M16,-364 C6,-350 8,-316 28,-300 L42,-310 C28,-322 24,-348 30,-362 Z" fill="#0a0c0f"/>' : "";
        const band = ln ? '<rect x="-27" y="-366" width="58" height="10" fill="#0a0c0f" stroke="none"/>' : "";
        const rim = o.rim ? '<path d="M-48,-300 C-60,-250 -64,-170 -68,-96 M-28,-352 C-28,-388 -18,-396 2,-396" fill="none" stroke="' + o.rim + '" stroke-width="4" stroke-linecap="round"/>' : "";
        return (
          '<g fill="' + f + '"' + st + ">" +
          '<path d="M-34,-100 L-10,-100 L-8,-10 L-32,-10 Z M8,-100 L32,-100 L34,-10 L10,-10 Z"/>' +
          '<path d="M-38,-12 L-4,-12 L4,0 L-38,0 Z M8,-12 L40,-12 L52,0 L8,0 Z"/>' +
          '<path d="M-48,-300 C-60,-250 -64,-170 -68,-96 L68,-96 C64,-170 60,-250 48,-300 C30,-312 -30,-312 -48,-300 Z"/>' +
          '<path d="M-32,-300 L-22,-334 L2,-318 L24,-334 L36,-300 Z"/>' +
          '<circle cx="2" cy="-334" r="23"/>' + (hats[o.hat || "fedora"]) + band + "</g>" + arm + handset + rim
        );
      };
      // Glass payphone booth, base at (bx, b), scale k; the panes can light teal.
      const BOOTH = (bx, b, k, litId) => {
        const r = (x, y, w, h, extra) => '<rect x="' + (bx + x * k) + '" y="' + (b + y * k) + '" width="' + w * k + '" height="' + h * k + '" ' + extra + "/>";
        return {
          back:
            r(-78, -306, 156, 306, 'rx="4" fill="#1c2128" stroke="#0a0c0f" stroke-width="' + 3 * k + '"') +
            r(-64, -284, 128, 266, 'fill="#2b313a"') +
            r(-64, -284, 128, 266, 'id="' + litId + '" fill="#58cfc2" opacity="0"') +
            r(14, -250, 40, 64, 'rx="4" fill="#0a0c0f"') +
            r(20, -228, 28, 4, 'fill="#3a424d"'),
          front:
            r(-4, -284, 8, 266, 'fill="#1c2128"') +
            r(-64, -196, 128, 8, 'fill="#1c2128"') +
            r(-64, -104, 128, 8, 'fill="#1c2128"') +
            r(-86, -328, 172, 30, 'rx="4" fill="#0a0c0f"') +
            r(-48, -322, 96, 16, 'fill="#c9ccd1" opacity="0.8"'),
        };
      };
      document.getElementById("fl-safe").innerHTML = FIG({ arm: "reach", rim: "#8a929c" });
      document.getElementById("fl-man-f").innerHTML = FIG({ arm: "down", hat: "cap", rim: "#8a929c" });
      document.getElementById("m6-fig").innerHTML = FIG({ fill: "#ece8df", line: "#0a0c0f", arm: "hold" });
      let b = "";
      for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) b += '<rect x="' + (440 + c * 62) + '" y="' + (200 + r * 64) + '" width="54" height="56"/>';
      document.getElementById("fl-boxes").innerHTML = b;
      const ticks = (id, cx, cy, r1, r2, n) => {
        let t = "";
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          t += '<path d="M' + (cx + r1 * Math.sin(a)).toFixed(1) + " " + (cy - r1 * Math.cos(a)).toFixed(1) + " L" + (cx + r2 * Math.sin(a)).toFixed(1) + " " + (cy - r2 * Math.cos(a)).toFixed(1) + '"/>';

        document.getElementById(id).innerHTML = t;
      };
      ticks("m0-ticks", 233, 250, 92, 104, 40);
      ticks("m4-ticks", 233, 230, 108, 122, 12);
      ticks("m7-ticks", 233, 250, 130, 146, 12);
      let d = "";
      for (let i = 0; i <= 200; i++) {
        const th = i * 0.38;
        d += (i ? " L" : "M") + (330 + 22 * Math.sin(th)).toFixed(1) + " " + (-20 + i * 1.6 + 10 * Math.cos(th)).toFixed(1);

      document.getElementById("m5-cord").setAttribute("d", d);
      document.getElementById("m5-cord2").setAttribute("d", d);
    })();

    const tl = gsap.timeline({ paused: true });
    const wipe = (sel, at) => tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -6%)" }, { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.32, ease: "power2.out" }, at);

    tl.to("#fl-door", { scaleX: 0.1, svgOrigin: "1450 740", duration: 0.35, ease: "power3.out" }, 1.4);

    tl.to("#fl-boxes rect:nth-child(9)", { scaleX: 0.15, svgOrigin: "626 328", duration: 0.3, ease: "power3.out" }, 2.6);

    // Eight panels: everyone at work at once.
    tl.to("#fl-cap", { opacity: 0, duration: 0.15, ease: "power3.in" }, 4.0);
    tl.to("#fl-a", { clipPath: "inset(0px 968.5px 549px 484.5px)", duration: 0.6, ease: "power3.inOut" }, 4.2);
    tl.fromTo("#fl-art", { x: 0, y: 0, scale: 1, transformOrigin: "0px 0px" }, { x: 30, y: 60, scale: 0.62, duration: 0.6, ease: "power3.inOut" }, 4.2);
    // The cut-away shrinks into one panel and uncovers the other seven beneath it.
    tl.fromTo(".mini", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 4.19);
    tl.fromTo("#m0-dial", { rotation: 0, svgOrigin: "233 250" }, { keyframes: [{ rotation: 120, duration: 0.6 }, { rotation: 40, duration: 0.5 }, { rotation: 190, duration: 0.7 }, { rotation: 150, duration: 0.6 }], ease: "power2.inOut", svgOrigin: "233 250" }, 4.5);
    tl.fromTo("#m2-stamp", { y: -40 }, { y: 40, duration: 0.28, ease: "power3.in", yoyo: true, repeat: 5 }, 4.5);
    tl.to("#m2-mark", { opacity: 1, duration: 0.05 }, 4.78);
    tl.fromTo("#m3-lens", { x: 0, y: 0 }, { keyframes: [{ x: 160, y: -10, duration: 0.9 }, { x: 40, y: 50, duration: 0.8 }, { x: 200, y: 40, duration: 0.8 }], ease: "power2.inOut" }, 4.5);
    tl.fromTo("#m4-hand", { rotation: 0, svgOrigin: "233 230" }, { rotation: 360, svgOrigin: "233 230", duration: 3, ease: "none" }, 4.5);
    tl.fromTo("#m6-loupe", { x: 0, y: 40 }, { x: -20, y: -10, duration: 0.8, ease: "power2.out" }, 4.6);
    tl.fromTo("#m7-hour", { rotation: 90, svgOrigin: "233 250" }, { rotation: 120, svgOrigin: "233 250", duration: 3, ease: "none" }, 4.5);
    tl.fromTo("#m7-min", { rotation: 0, svgOrigin: "233 250" }, { rotation: 360, svgOrigin: "233 250", duration: 3, ease: "none" }, 4.5);
    const w5 = { t: 0 };
    tl.fromTo(w5, { t: 0 }, { t: 3, duration: 3, ease: "none", onUpdate: () => {
      let d = "";
      for (let i = 0; i <= 80; i++) {
        const env = Math.sin((i / 80) * Math.PI);
        d += (i ? " L" : "M") + (40 + i * 4.8).toFixed(1) + " " + (430 + 50 * env * Math.sin(i * 0.6 + w5.t * 20) * Math.sin(i * 0.15 - w5.t * 6)).toFixed(1);
      }
      document.getElementById("m5-wave").setAttribute("d", d);
    } }, 4.5);
    wipe("#fl-all", 4.9);
    // Zoom through the appraiser's panel into his room.
    tl.to("#fl-all", { opacity: 0, duration: 0.15, ease: "power3.in" }, 6.85);
    tl.set("#m6", { zIndex: 50 }, 6.9);
    tl.to("#m6", { x: -242.5, y: -274.5, scale: 4.3, transformOrigin: "50% 50%", duration: 0.6, ease: "power3.in" }, 6.9);
