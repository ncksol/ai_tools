  <script>
    (function () {
      // Pins: the crew's positions across the city; each follows a street route.
      const routes = [
        [[20, 40], [20, 100], [66, 100], [66, 150]],
        [[158, 40], [112, 40], [112, 150], [66, 150]],
        [[20, 290], [20, 240], [112, 240], [112, 150]],
        [[158, 290], [158, 240], [158, 150], [112, 150]],
        [[66, 290], [66, 240], [20, 240], [20, 150]],
        [[112, 0], [112, 40], [158, 40], [158, 100]],
      ];
      window.__mpRoutes = routes;
      let s = "";
      routes.forEach((r, i) => {
        s += '<g id="mp-p' + i + '"><path d="M0 0 C-9 -10 -9 -22 0 -22 C9 -22 9 -10 0 0 Z" fill="#58cfc2" stroke="#ece8df" stroke-width="2.5"/><circle cx="0" cy="-15" r="3.5" fill="#0a0c0f"/></g>';
      });
      document.getElementById("mp-pins").innerHTML = s;
    })();
    const tl = gsap.timeline({ paused: true });
    const wipe = (sel, at) => tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -6%)" }, { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.32, ease: "power2.out" }, at);
    const pop = (sel, at, origin) => tl.fromTo(sel, { opacity: 0, scale: 0.86, transformOrigin: origin || "50% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, at);
    const out = (sel, at) => tl.to(sel, { opacity: 0, duration: 0.15, ease: "power3.in" }, at);
    const routes = window.__mpRoutes;
    const along = (r, u) => {
      const segs = [];
      let total = 0;
      for (let i = 1; i < r.length; i++) {
        const L = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
        segs.push(L);
        total += L;
      }
      let d = u * total;
      for (let i = 1; i < r.length; i++) {
        if (d <= segs[i - 1] || i === r.length - 1) {
          const f = Math.min(1, d / segs[i - 1]);
          return [r[i - 1][0] + (r[i][0] - r[i - 1][0]) * f, r[i - 1][1] + (r[i][1] - r[i - 1][1]) * f];
        }
        d -= segs[i - 1];
      }
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 6.5, duration: 6.5, ease: "none", onUpdate: () => {
      routes.forEach((r, i) => {
        const u = Math.min(1, Math.max(0, (clock.t - i * 0.25) / (5.5 - i * 0.3)));
        const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        const [x, y] = along(r, e);
        document.getElementById("mp-p" + i).setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
      });
    } }, 0);

    // Close on the phone's map, then pull back: he is asleep, the pins keep moving.
    tl.fromTo("#mp-art", { x: -2835, y: -1059, scale: 2.4, transformOrigin: "0px 0px" }, { x: -2835, y: -1059, scale: 2.4, duration: 3.0, ease: "none" }, 0);
    wipe("#mp-cap1", 0.2);
    out("#mp-cap1", 2.95);
    tl.to("#mp-art", { x: 0, y: 0, scale: 1, duration: 1.0, ease: "power2.inOut" }, 3.0);
    wipe("#mp-cap2", 4.1);
    window.__timelines["map"] = tl;
  </script>
