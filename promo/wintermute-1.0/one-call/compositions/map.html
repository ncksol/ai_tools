      <rect x="-600" y="-600" width="3120" height="2280" fill="#1b1f25" />
      <!-- His desk at home, past midnight: he has fallen asleep beside the map (drawn by DESK_SCENE) -->
      <g id="mp-room"></g>
      <g id="mp-phone">
        <path d="M600 760 L620 738 L712 738 L732 760 Z" fill="#0a0c0f" />
        <rect x="560" y="368" width="212" height="372" rx="30" fill="#0a0c0f" />

          <rect width="184" height="312" fill="#1b2027" />
          <path d="M-10 190 C40 170 80 210 120 196 S170 176 200 186" fill="none" stroke="#0e1115" stroke-width="22" />
          <g stroke="#2e353e" stroke-width="5"><path d="M20 0 V312 M66 0 V312 M112 0 V312 M158 0 V312 M0 40 H184 M0 100 H184 M0 150 H184 M0 240 H184 M0 290 H184" /></g>
          <g id="mp-pins"></g>
        </svg>

    <div id="mp-cap1" class="cap" style="left: 96px; top: 70px">All night, watch the pins move.</div>

    <div id="mp-z" class="sfx" style="left: 1190px; top: 380px; font-size: 64px">z Z z</div>
  </div>
  <script>
    (function () {
      const { HANDSET_D, CORD_AT, HANDSET, HS_POINT, COIL, DESK_HS, DESKPHONE, INK, st, C_HEAD, C_FIST, LIMBS, CUFF, C_TORSO, C_PHONE, C_SLEEP, C_STAND, PROPS, CREW, GLOVE, HAT, FIG_HS, C_PHONE_HS, C_AT, C_EAR, C_MOUTH, DESK_SCENE, JOB_ON_DESK, SKIN, SKIN_D, SHIRT, SHIRT_D, TIE, TROUSER } = window.OC;
      document.getElementById("mp-room").innerHTML = DESK_SCENE({ cx: 1430, s: 1.5, Y: 760, wx: 1150, lampX: 1760, phoneX: 1000, mugX: 300, sleep: true, phoneId: "mp-deskphone", clientId: "mp-client" });
      // Pins: the four crew members across the city; each follows a street route.
      const routes = [
        [[20, 40], [20, 100], [66, 100], [66, 150]],
        [[158, 40], [112, 40], [112, 150], [66, 150]],
        [[20, 290], [20, 240], [112, 240], [112, 150]],
        [[158, 290], [158, 240], [158, 150], [112, 150]],
      ];
      window.__mpRoutes = routes;
      let s = "";
      routes.forEach((r, i) => {
        s += '<g id="mp-p' + i + '"><path d="M0 0 C-9 -10 -9 -22 0 -22 C9 -22 9 -10 0 0 Z" fill="#58cfc2" stroke="#ece8df" stroke-width="2.5"/><circle cx="0" cy="-15" r="3.5" fill="#0a0c0f"/></g>';
      });
      document.getElementById("mp-pins").innerHTML = s;
    })();
    const tl = gsap.timeline({ paused: true });
    const wipe = (sel, at) => tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -6%)" }, { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.32, ease: "power2.out" }, at);
    const pop = (sel, at, origin) => tl.fromTo(sel, { opacity: 0, scale: 0.86, transformOrigin: origin || "50% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, at);
    const out = (sel, at) => tl.to(sel, { opacity: 0, duration: 0.15, ease: "power3.in" }, at);
    const routes = window.__mpRoutes;
    const along = (r, u) => {
      const segs = [];
      let total = 0;
      for (let i = 1; i < r.length; i++) {
        const L = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
        segs.push(L);
        total += L;
      }
      let d = u * total;
      for (let i = 1; i < r.length; i++) {
        if (d <= segs[i - 1] || i === r.length - 1) {
          const f = Math.min(1, d / segs[i - 1]);
          return [r[i - 1][0] + (r[i][0] - r[i - 1][0]) * f, r[i - 1][1] + (r[i][1] - r[i - 1][1]) * f];
        }
        d -= segs[i - 1];
      }
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 6.5, duration: 6.5, ease: "none", onUpdate: () => {
      routes.forEach((r, i) => {
        const u = Math.min(1, Math.max(0, (clock.t - i * 0.25) / (5.5 - i * 0.3)));
        const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        const [x, y] = along(r, e);
        document.getElementById("mp-p" + i).setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
      });
    } }, 0);

    // Close on the phone's map, then pull back: he is asleep, the pins keep moving.
    tl.fromTo("#mp-art", { x: -638.4, y: -789.6, scale: 2.4, transformOrigin: "0px 0px" }, { x: -638.4, y: -789.6, scale: 2.4, duration: 3.0, ease: "none" }, 0);
    wipe("#mp-cap1", 0.2);
    out("#mp-cap1", 2.95);
    tl.to("#mp-art", { x: 0, y: 0, scale: 1, duration: 1.0, ease: "power2.inOut" }, 3.0);
    wipe("#mp-cap2", 4.1);
    tl.fromTo("#mp-z", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 4.5);
    window.__timelines["map"] = tl;
  </script>
