  <script>
    (function () {
      // A payphone handset in side view: earpiece cup at the top, curved grip, mouthpiece angled forward.
      // Local frame: earpiece face at x=54, cord leaves the grip at CORD_AT. About 300 units tall.
      const HANDSET_D =
        "M46 -42 Q54 -42 54 -34 L54 34 Q54 42 46 42 L22 36 C8 92 6 140 22 188 L50 180 Q57 178 60 184 L92 238 Q95 245 88 249 C62 262 30 263 8 250 C-16 202 -24 112 -12 40 C-19 18 -17 -16 1 -30 Z";
      const CORD_AT = [6, 254];
      const HANDSET = (o) => {
        const fill = o.fill || "#0a0c0f";
        const line = o.line || null;
        const lw = o.lw || 4;
        const t = 'translate(' + o.x + " " + o.y + ") rotate(" + (o.rot || 0) + ") scale(" + (o.flip ? -(o.s || 1) : o.s || 1) + " " + (o.s || 1) + ")";
        const grille = o.grille || line || "#3a424d";
        return (
          '<g transform="' + t + '">' +
          '<path d="' + HANDSET_D + '" fill="' + fill + '"' + (line ? ' stroke="' + line + '" stroke-width="' + lw + '" stroke-linejoin="round"' : "") + "/>" +
          '<path d="M50 -30 V30 M57 191 L85 238" stroke="' + grille + '" stroke-width="' + lw * 0.9 + '" stroke-linecap="round" opacity="0.8"/>' +
          "</g>"
        );
      };
      // Where a point in handset-local coordinates lands after HANDSET's transform.
      const HS_POINT = (o, p) => {
        const s = o.s || 1;
        const a = ((o.rot || 0) * Math.PI) / 180;
        const px = (o.flip ? -1 : 1) * p[0] * s;
        const py = p[1] * s;
        return [o.x + px * Math.cos(a) - py * Math.sin(a), o.y + px * Math.sin(a) + py * Math.cos(a)];
      };
      // A coiled phone cord along a sagging curve from (x1,y1) to (x2,y2), control point (cx,cy).
      const COIL = (x1, y1, cx, cy, x2, y2, loops, amp) => {
        const n = Math.max(80, loops * 14);
        let d = "";
        for (let i = 0; i <= n; i++) {
          const s = i / n;
          const bx = (1 - s) * (1 - s) * x1 + 2 * (1 - s) * s * cx + s * s * x2;
          const by = (1 - s) * (1 - s) * y1 + 2 * (1 - s) * s * cy + s * s * y2;
          let tx = 2 * (1 - s) * (cx - x1) + 2 * s * (x2 - cx);
          let ty = 2 * (1 - s) * (cy - y1) + 2 * s * (y2 - cy);
          const L = Math.hypot(tx, ty) || 1;
          tx /= L;
          ty /= L;
          const ph = 2 * Math.PI * loops * s;
          const ends = Math.min(1, s * 12, (1 - s) * 12);
          const x = bx + ends * (-ty * amp * Math.sin(ph) + tx * amp * 0.55 * Math.cos(ph));
          const y = by + ends * (tx * amp * Math.sin(ph) + ty * amp * 0.55 * Math.cos(ph));
          d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
        }
        return d;
      };
      // A rotary desk phone with its handset in the cradle; base centred on (x, y) = bottom middle.
      const DESK_HS = (x, y, k) => ({ x: x + 95 * k, y: y - 152 * k, rot: 90, s: 0.86 * k, fill: "#0a0c0f", line: "#3a424d", lw: 3 / (0.86 * k), grille: "#3a424d" });
      const DESKPHONE = (x, y, k, withHandset) => {
        const P = (px, py) => (x + px * k).toFixed(1) + " " + (y + py * k).toFixed(1);
        let s =
          '<path d="M' + P(-110, 0) + " L" + P(-84, -78) + " Q" + P(-80, -88) + " " + P(-68, -88) + " L" + P(68, -88) + " Q" + P(80, -88) + " " + P(84, -78) + " L" + P(110, 0) + ' Z" fill="#1c2128" stroke="#0a0c0f" stroke-width="' + 4 * k + '"/>' +
          '<circle cx="' + (x).toFixed(1) + '" cy="' + (y - 44 * k).toFixed(1) + '" r="' + (30 * k).toFixed(1) + '" fill="#3a424d" stroke="#0a0c0f" stroke-width="' + 3 * k + '"/>' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + (y - 44 * k).toFixed(1) + '" r="' + (10 * k).toFixed(1) + '" fill="#0a0c0f"/>' +
          '<path d="M' + P(-92, -86) + " L" + P(-88, -106) + " M" + P(92, -86) + " L" + P(88, -106) + '" stroke="#0a0c0f" stroke-width="' + 12 * k + '" stroke-linecap="round"/>';
        if (withHandset) s += HANDSET(DESK_HS(x, y, k));
        return s;
      };
      // Noir figure, feet at (0,0), facing right, about 400 units tall.
      const FIG = (o) => {
        const f = o.fill || "#0a0c0f";
        const ln = o.line || null;
        const st = ln ? ' stroke="' + ln + '" stroke-width="4" stroke-linejoin="round"' : "";
        const hats = {
          fedora: '<ellipse cx="2" cy="-352" rx="50" ry="9"/><path d="M-28,-352 C-28,-388 -18,-396 2,-396 C22,-396 32,-388 32,-352 Z"/>',
          bowler: '<ellipse cx="2" cy="-352" rx="40" ry="7"/><path d="M-27,-352 C-27,-404 31,-404 31,-352 Z"/>',
          cap: '<path d="M-32,-350 C-36,-372 -14,-386 4,-386 C22,-386 42,-372 38,-350 Z"/><ellipse cx="3" cy="-350" rx="36" ry="7"/>',
          boater: '<rect x="-27" y="-376" width="58" height="24"/><ellipse cx="2" cy="-352" rx="48" ry="6"/>',
        };
        const arms = {
          phone: "M32,-290 Q80,-262 48,-318",
          down: "M30,-290 C46,-240 50,-190 46,-150",
          hold: "M30,-290 Q60,-236 96,-220",
          reach: "M30,-290 Q86,-262 132,-236",
          point: "M30,-292 Q90,-300 132,-322",
        };
        const armD = arms[o.arm || "down"];
        const arm = (ln ? '<path d="' + armD + '" fill="none" stroke="' + ln + '" stroke-width="34" stroke-linecap="round"/>' : "") + '<path d="' + armD + '" fill="none" stroke="' + f + '" stroke-width="26" stroke-linecap="round"/>';
        const handset = o.arm === "phone" ? '<path d="M16,-364 C6,-350 8,-316 28,-300 L42,-310 C28,-322 24,-348 30,-362 Z" fill="#0a0c0f"/>' : "";
        const band = ln ? '<rect x="-27" y="-366" width="58" height="10" fill="#0a0c0f" stroke="none"/>' : "";
        const rim = o.rim ? '<path d="M-48,-300 C-60,-250 -64,-170 -68,-96 M-28,-352 C-28,-388 -18,-396 2,-396" fill="none" stroke="' + o.rim + '" stroke-width="4" stroke-linecap="round"/>' : "";
        return (
          '<g fill="' + f + '"' + st + ">" +
          '<path d="M-34,-100 L-10,-100 L-8,-10 L-32,-10 Z M8,-100 L32,-100 L34,-10 L10,-10 Z"/>' +
          '<path d="M-38,-12 L-4,-12 L4,0 L-38,0 Z M8,-12 L40,-12 L52,0 L8,0 Z"/>' +
          '<path d="M-48,-300 C-60,-250 -64,-170 -68,-96 L68,-96 C64,-170 60,-250 48,-300 C30,-312 -30,-312 -48,-300 Z"/>' +
          '<path d="M-32,-300 L-22,-334 L2,-318 L24,-334 L36,-300 Z"/>' +
          '<circle cx="2" cy="-334" r="23"/>' + (hats[o.hat || "fedora"]) + band + "</g>" + arm + handset + rim
        );
      };
      // Glass payphone booth, base at (bx, b), scale k; the panes can light teal.
      const BOOTH = (bx, b, k, litId) => {
        const r = (x, y, w, h, extra) => '<rect x="' + (bx + x * k) + '" y="' + (b + y * k) + '" width="' + w * k + '" height="' + h * k + '" ' + extra + "/>";
        return {
          back:
            r(-78, -306, 156, 306, 'rx="4" fill="#1c2128" stroke="#0a0c0f" stroke-width="' + 3 * k + '"') +
            r(-64, -284, 128, 266, 'fill="#2b313a"') +
            r(-64, -284, 128, 266, 'id="' + litId + '" fill="#58cfc2" opacity="0"') +
            r(14, -250, 40, 64, 'rx="4" fill="#0a0c0f"') +
            r(20, -228, 28, 4, 'fill="#3a424d"'),
          front:
            r(-4, -284, 8, 266, 'fill="#1c2128"') +
            r(-64, -196, 128, 8, 'fill="#1c2128"') +
            r(-64, -104, 128, 8, 'fill="#1c2128"') +
            r(-86, -328, 172, 30, 'rx="4" fill="#0a0c0f"') +
            r(-48, -322, 96, 16, 'fill="#c9ccd1" opacity="0.8"'),
        };
      };
      document.getElementById("dw-phone").innerHTML = DESKPHONE(1470, 690, 0.8, false);
      document.getElementById("dw-receiver").innerHTML = HANDSET(DESK_HS(1470, 690, 0.8));
      const cp = HS_POINT(DESK_HS(1470, 690, 0.8), CORD_AT);
      document.getElementById("dw-cord").setAttribute("d", COIL(cp[0], cp[1], cp[0] - 40, 690, 1404, 676, 7, 6));
      const crew = [
        { arm: "hold", hat: "fedora" },
        { arm: "down", hat: "fedora" },
        { arm: "down", hat: "fedora" },
        { arm: "down", hat: "fedora" },
        { arm: "down", hat: "cap" },
      ];
      let s = "";
      crew.forEach((c, i) => {
        s += '<g id="dw-c' + i + '" opacity="0"><g transform="translate(300 1000) scale(1.55)">' + FIG(Object.assign({ rim: "#8a929c" }, c)) + "</g></g>";
      });
      document.getElementById("dw-crew").innerHTML = s;
    })();
    const tl = gsap.timeline({ paused: true });
    const wipe = (sel, at) => tl.fromTo(sel, { clipPath: "inset(-30% 100% -30% -6%)" }, { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.32, ease: "power2.out" }, at);
    const pop = (sel, at, origin) => tl.fromTo(sel, { opacity: 0, scale: 0.86, transformOrigin: origin || "50% 100%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, at);
    const out = (sel, at) => tl.to(sel, { opacity: 0, duration: 0.15, ease: "power3.in" }, at);
    // Colour flood: night lifts into dawn, the rain has stopped.
    tl.fromTo("#dw-night", { opacity: 0.62 }, { opacity: 0, duration: 1.3, ease: "power2.inOut" }, 0);
    tl.fromTo("#dw-sky", { attr: { fill: "#262c34" } }, { attr: { fill: "#d9dde0" }, duration: 1.3, ease: "power2.inOut" }, 0);
    tl.fromTo("#dw-beam", { opacity: 0 }, { opacity: 0.1, duration: 1.3, ease: "power2.inOut" }, 0.2);
    wipe("#dw-cap1", 0.2);
    // The door opens; the crew slips in, one by one, carrying the job.
    tl.to("#dw-door", { scaleX: 0.16, svgOrigin: "134 600", duration: 0.45, ease: "power3.out" }, 0.55);
    const targets = [740, 610, 480, 350, 220];
