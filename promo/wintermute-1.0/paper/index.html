<!doctype html>
<html lang="en" data-resolution="landscape"
  data-composition-variables='[
    {"id":"paper-blue","type":"color","label":"Blue house","default":"#6598bc"},
    {"id":"paper-orange","type":"color","label":"Orange house","default":"#dc9870"},
    {"id":"paper-sage","type":"color","label":"Sage house","default":"#91afa0"},
    {"id":"paper-rose","type":"color","label":"Rose house","default":"#c98f97"},
    {"id":"paper-end-first","type":"string","label":"End card, first line","default":"Hand over the"},
    {"id":"paper-end-second","type":"string","label":"End card, second line","default":"crumpled thing."},
    {"id":"paper-release","type":"string","label":"Release","default":"Wintermute 1.0"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Paper Nunito";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/nunito-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Paper Nunito";
        font-style: normal;
        font-weight: 900;
        font-display: block;
        src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2");
      }
      :root {
        --ground: #dcc3a2;
        --ink: #334b50;
        --paper-blue: #6598bc;
        --paper-orange: #dc9870;
        --paper-sage: #91afa0;
        --paper-rose: #c98f97;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Paper Nunito", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="84"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div id="paper" class="clip" data-composition-id="paper"
        data-composition-src="compositions/paper.html"
        data-start="0" data-duration="84" data-width="1920" data-height="1080"
        data-track-index="1" data-track-kind="graphics" style="position:absolute;inset:0;z-index:1"></div>
      <audio id="paper-sfx" class="clip" src="assets/audio/paper-sfx.wav"
        data-start="0" data-duration="84" data-track-index="20" data-volume="1"></audio>
      <audio id="paper-music" class="clip" src="assets/audio/music.mp3"
        data-start="0" data-duration="84" data-track-index="21"
        data-volume="0.3" data-fade-in="0.4" data-fade-out="1.4" data-hidden="true"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
