<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm dashboard mockup (sample data)</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:light;
  --bg-primary:oklch(0.975 0.004 250);
  --bg-secondary:oklch(0.993 0.002 250);
  --bg-tertiary:oklch(0.95 0.005 250);
  --text-primary:oklch(0.30 0.02 255);
}
body{margin:0;padding:16px;background:var(--bg-primary);color:var(--text-primary)}
#r2{
  --surface:var(--bg-secondary);--sunk:var(--bg-tertiary);
  --line:oklch(0.905 0.008 250);--line-2:oklch(0.94 0.006 250);
  --ink:oklch(0.30 0.02 255);--ink-2:oklch(0.48 0.018 255);--ink-3:oklch(0.55 0.015 255);
  --meter:oklch(0.80 0.03 250);--focus:oklch(0.55 0.10 245);
  --busy:oklch(0.84 0.07 238);--busy-ink:oklch(0.46 0.09 245);--busy-soft:oklch(0.955 0.02 238);
  --idle:oklch(0.87 0.012 250);--idle-ink:oklch(0.48 0.015 250);--idle-soft:oklch(0.96 0.004 250);
  --plan:oklch(0.89 0.08 92);--plan-ink:oklch(0.47 0.08 75);--plan-soft:oklch(0.97 0.03 95);
  --question:oklch(0.85 0.07 300);--question-ink:oklch(0.47 0.11 300);--question-soft:oklch(0.965 0.02 300);
  --stuck:oklch(0.78 0.11 25);--stuck-ink:oklch(0.49 0.14 27);--stuck-soft:oklch(0.96 0.025 25);
  --blocked:oklch(0.85 0.085 62);--blocked-ink:oklch(0.48 0.10 55);--blocked-soft:oklch(0.965 0.03 65);
  --merged:oklch(0.86 0.07 160);--merged-ink:oklch(0.45 0.08 160);--merged-soft:oklch(0.965 0.02 160);
  --archived:oklch(0.91 0.006 250);--archived-ink:oklch(0.55 0.012 250);--archived-soft:oklch(0.97 0.003 250);
  --stg-planned:var(--surface);--stg-coding:oklch(0.955 0.025 195);--stg-pr:oklch(0.925 0.045 188);--stg-review:oklch(0.895 0.06 178);
  --stg-merged:var(--merged);--stg-archived:var(--archived);--stg-ink:oklch(0.62 0.07 185);
  max-width:1920px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  font:400 14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;
}
#r2 *{box-sizing:border-box}
#r2 h2,#r2 h3,#r2 h4,#r2 p,#r2 ol,#r2 ul{margin:0;padding:0}
#r2 ol,#r2 ul{list-style:none}
#r2 h2{font-size:18px;line-height:24px;font-weight:500}
#r2 h3,#r2 h4{font-size:14px;line-height:20px;font-weight:500}
#r2 button{font:inherit;color:inherit;margin:0}
#r2 a{color:var(--busy-ink)}
#r2 :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.st-busy{--c:var(--busy);--c-ink:var(--busy-ink);--c-soft:var(--busy-soft)}
.st-idle{--c:var(--idle);--c-ink:var(--idle-ink);--c-soft:var(--idle-soft)}
.st-plan{--c:var(--plan);--c-ink:var(--plan-ink);--c-soft:var(--plan-soft)}
.st-question{--c:var(--question);--c-ink:var(--question-ink);--c-soft:var(--question-soft)}
.st-stuck{--c:var(--stuck);--c-ink:var(--stuck-ink);--c-soft:var(--stuck-soft)}
.st-blocked{--c:var(--blocked);--c-ink:var(--blocked-ink);--c-soft:var(--blocked-soft)}
.st-merged{--c:var(--merged);--c-ink:var(--merged-ink);--c-soft:var(--merged-soft)}
.st-archived{--c:var(--archived);--c-ink:var(--archived-ink);--c-soft:var(--archived-soft)}
.st-planned{--c:var(--surface);--c-ink:var(--ink-2);--c-soft:var(--surface)}
.st-pr{--c:var(--stg-pr);--c-ink:oklch(0.45 0.07 190);--c-soft:var(--stg-coding)}
.rp-complete{--r:var(--merged-ink)}.rp-needs{--r:var(--question-ink)}.rp-blocked{--r:var(--blocked-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--r,var(--c-ink));flex:none}
.muted{color:var(--ink-2)}
.small{font-size:12px;line-height:16px}
.usd{font-size:12px;font-weight:400;color:var(--ink-2)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg button{padding:0 12px;height:28px;border:0;border-radius:4px;background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--sunk);color:var(--ink)}
.kv{display:flex;flex-direction:column;min-width:0}
.kv .k{font-size:12px;line-height:16px;color:var(--ink-2)}
.kv .v{font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.kv .v.l{font-size:18px;line-height:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:4px;font-size:12px;line-height:16px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip .dot{width:6px;height:6px}
.chip.st-stuck{border-color:var(--stuck);color:var(--stuck-ink)}
.none{font-size:12px;line-height:24px;color:var(--ink-2)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{from{background:var(--busy-soft)}to{background:transparent}}
.is-new{animation:fadein .6s cubic-bezier(.25,1,.5,1)}

/* mockup chrome */
.mk-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.mk-title{display:flex;flex-direction:column;gap:4px;max-width:80ch}
.mk-title p{color:var(--ink-2)}
.mk-go{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12px;line-height:16px}
.mk-go button{padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;line-height:16px}
.mk-go button:hover{border-color:var(--ink-3)}
.mk-go button[aria-current=true]{background:var(--sunk)}
.mk-stage[data-w=panel] .dash{width:560px;max-width:100%;margin:0 auto}
.mk-cap{font-size:12px;line-height:16px;color:var(--ink-2);text-align:center}
.mk-stage{display:flex;flex-direction:column;gap:8px}
.mk-stage:not([data-w=panel]) .mk-cap{display:none}

/* dashboard frame */
.dash{container:dash/inline-size;display:flex;flex-direction:column;gap:16px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.d-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.d-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.d-id{display:flex;align-items:center;gap:12px;min-width:0}
.d-name{font-weight:500}
.d-facts{display:flex;flex-wrap:wrap;gap:8px 32px}
.d-counts{display:grid;grid-template-columns:repeat(6,auto);gap:8px 24px}
.tile{display:flex;flex-direction:column}
.tile .v{font-size:18px;line-height:24px;font-weight:500}
.tile .k{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap}
.needs{display:flex;flex-direction:column;gap:8px}
.needs-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.need{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.need-k{display:inline-flex;align-items:center;gap:4px;color:var(--c-ink)}
.need-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.d-body.has-detail{grid-template-columns:minmax(0,1fr) 440px}
.d-body.is-narrow{grid-template-columns:minmax(0,1fr)}
.d-main{container:main/inline-size;display:flex;flex-direction:column;gap:12px;min-width:0}
.d-side{min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:4px 12px 8px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--ink-2);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
@container dash (max-width:720px){
  .d-counts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .needs-list{grid-template-columns:minmax(0,1fr)}
}

/* cards */
.b-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:12px}
.b-card{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.b-card:hover{border-color:var(--ink-3)}
.b-card.st-plan,.b-card.st-question,.b-card.st-stuck,.b-card.st-blocked{background:var(--c-soft);border-color:var(--c)}
.b-card.is-sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.b-head{display:flex;align-items:center;gap:12px;height:40px;min-width:0}
.b-who{display:flex;flex-direction:column;min-width:0;flex:1}
.b-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-state{font-size:12px;line-height:16px;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-pr{font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap}
.ring{flex:none}
.ring svg{display:block}
.ring .trk{fill:none;stroke:var(--line);stroke-width:4}
.ring .arc{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round}
.ring .arc.spin{transform-origin:20px 20px;animation:spin 4s linear infinite}
.ring .arc.stuck{stroke-dasharray:4 4;stroke-linecap:butt;animation:blink 2.4s ease-in-out infinite}
.ring text{font-size:12px;font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.b-metrics{display:grid;grid-template-columns:56px minmax(0,1fr);row-gap:4px;column-gap:8px;align-items:baseline}
.b-metrics .k,.b-rows .k{font-size:12px;line-height:16px;color:var(--ink-2)}
.b-metrics .v{font-size:18px;line-height:24px;font-weight:500;white-space:nowrap}
.b-metrics .meter{align-self:center}
.meter,.bar{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter i,.bar i{display:block;height:100%;border-radius:2px}
.meter i{background:var(--meter)}
.bar i{background:var(--c)}
.b-rep{display:flex;align-items:center;gap:8px;height:20px;min-width:0}
.badge{flex:none;height:20px;padding:0 8px;border-radius:4px;font-size:12px;line-height:20px;color:var(--r);background:color-mix(in oklch,var(--r) 12%,var(--surface))}
.b-rep-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-age{flex:none;font-size:12px;line-height:16px;color:var(--ink-2)}
.b-rep.is-new{animation:flash 1.6s cubic-bezier(.25,1,.5,1)}
.b-rows{display:grid;grid-template-columns:56px minmax(0,1fr) 64px;column-gap:8px;row-gap:8px;align-items:center}
.b-rows .r{font-size:12px;line-height:16px;color:var(--ink-2);text-align:right;white-space:nowrap}
.stage{display:flex;gap:4px;height:4px}
.stage i{flex:1;border-radius:2px;background:var(--line-2)}
.stage i.on{background:var(--stg-ink)}
.mon{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;min-width:0}
.mon .dot{width:6px;height:6px}
.mon-alive .dot{background:var(--merged-ink)}
.mon-missing,.mon-paused{color:var(--blocked-ink)}
.mon-missing .dot,.mon-paused .dot{background:var(--blocked-ink)}
.mon-ended .dot,.mon-none .dot{background:var(--line)}
.b-card .chips{height:24px;overflow:hidden}
.cards-note{font-size:12px;line-height:16px;color:var(--ink-2)}

/* activity rail and feed */
.rail{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:8px}
.feed2{display:flex;flex-direction:column;gap:8px}
.fi{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:8px;font-size:12px;line-height:16px}
.fi-t{color:var(--ink-2);white-space:nowrap}
.fi-u{font-weight:500}
.fi.is-new{animation:flash 1.6s cubic-bezier(.25,1,.5,1)}

/* detail panel */
.detail{display:flex;flex-direction:column;gap:16px;padding:16px;border:1px solid var(--line);border-radius:8px;min-width:0}
.dt-top{display:flex;flex-direction:column;gap:12px}
.x{flex:none;width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;line-height:24px}
.link{align-self:flex-start;padding:0;border:0;background:none;color:var(--busy-ink);cursor:pointer;font-size:12px;line-height:16px}
.dt-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 16px}
.dt-sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line-2)}
.dt-why{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:8px;background:var(--stuck-soft);color:var(--stuck-ink)}
.dt-why p{font-size:12px;line-height:16px}
.dt-kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 8px;font-size:12px;line-height:16px}
.dt-kv .k{color:var(--ink-2)}
.dt-kv>span{min-width:0;overflow-wrap:anywhere}
.code{padding:0 4px;border-radius:4px;background:var(--sunk)}
.dt-rep-h{display:flex;align-items:center;gap:8px}
.dt-p{font-size:14px;line-height:20px}
.dt-list{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:16px}
.dt-list li{display:flex;gap:8px}
.dt-list li::before{content:"";flex:none;width:4px;height:4px;margin-top:6px;border-radius:50%;background:var(--ink-3)}
.sa-list{display:flex;flex-direction:column;gap:8px}
.sa{display:flex;flex-direction:column}
.sa-1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{flex:none;height:20px;padding:0 8px;border-radius:4px;font-size:12px;line-height:20px;color:var(--c-ink);background:var(--c-soft)}
.sa-2{font-size:12px;line-height:16px;color:var(--ink-2);overflow-wrap:anywhere}

/* plan and board */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:16px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend span.note{white-space:normal}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);flex:none}
.stg-planned{background:var(--stg-planned)}.stg-coding{background:var(--stg-coding)}.stg-pr{background:var(--stg-pr)}
.stg-review{background:var(--stg-review)}.stg-merged{background:var(--stg-merged)}.stg-archived{background:var(--stg-archived)}
.plan-g{position:relative}
.plan-g svg{position:absolute;left:0;top:0;overflow:visible}
.plan-g path{fill:none;stroke:var(--ink-3);stroke-width:1}
.pn{position:absolute;display:flex;flex-direction:column;padding:12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.pn.stg-planned{border-style:dashed;border-color:var(--ink-3)}
.pn.can{border-style:solid;border-color:var(--busy-ink)}
.pn-1{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;overflow:hidden}
.pn-2{font-size:12px;line-height:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-2 .s{color:var(--c-ink)}
.pn .dot{background:var(--c-ink)}
.pl{display:flex;flex-direction:column;gap:8px}
.pl-row{display:flex;flex-direction:column;padding:12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.pl-row.stg-planned{border-style:dashed;border-color:var(--ink-3)}
.pl-row.can{border-style:solid;border-color:var(--busy-ink)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:start}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.bcol-h{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap}
.bcol-h b{font-weight:500;color:var(--ink)}
.mc{display:flex;flex-direction:column;padding:12px;border:1px solid var(--line);border-radius:8px;min-width:0;background:var(--surface)}
.mc[data-open]{cursor:pointer}
.mc[data-open]:hover{border-color:var(--ink-3)}
.mc.st-plan,.mc.st-question,.mc.st-stuck,.mc.st-blocked{background:var(--c-soft);border-color:var(--c)}
.mc.planned{border-style:dashed;border-color:var(--ink-3)}
.mc.planned.can{border-style:solid;border-color:var(--busy-ink)}
.mc-1{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-2,.mc-3{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-2{color:var(--c-ink)}.mc-3{color:var(--ink-2)}

/* timeline */
.c{display:flex;flex-direction:column;gap:12px}
.c-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.c-bar .seg button{height:24px;padding:0 8px;font-size:12px;line-height:24px}
.c-keys{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:16px;color:var(--ink-2)}
.c-keys span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.c-keys svg{overflow:visible}
.c-rows{display:flex;flex-direction:column}
.c-row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who sum" "trk trk";column-gap:16px;row-gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.c-row.c-axis{grid-template-areas:"trk trk";padding:0 0 4px}
.c-row.c-axis .c-who,.c-row.c-axis .c-sum{display:none}
.c-row.c-cost{border-bottom:0}
@container main (min-width:760px){
  .c-row{grid-template-columns:200px minmax(0,1fr) 176px;grid-template-areas:"who trk sum";row-gap:0}
  .c-row.c-axis{grid-template-areas:"who trk sum"}
  .c-row.c-axis .c-who,.c-row.c-axis .c-sum{display:block}
}
.c-who{grid-area:who;min-width:0;display:flex;flex-direction:column}
.c-trk{grid-area:trk;min-width:0;position:relative}
.c-trk svg{display:block;overflow:visible}
.c-sum{grid-area:sum;min-width:0;display:flex;flex-direction:column;text-align:right}
@container main (min-width:760px){.c-sum{text-align:left}}
.c-name{display:flex;align-items:center;gap:8px;height:20px;font-weight:500;white-space:nowrap}
.c-name .dot{background:var(--c)}
.c-name .dot.stuck{background:none;border:1.5px dashed var(--stuck-ink)}
.c-meta{font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta .s{color:var(--c-ink)}
.c-rep{height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-rep .dot{margin-right:8px;vertical-align:0}
.c-head{font-size:12px;line-height:16px;color:var(--ink-2)}
.c-total{font-size:18px;line-height:24px;font-weight:500}
.t-busy{fill:var(--busy)}
.t-idle{stroke:var(--idle);stroke-width:2}
.t-plan{fill:var(--plan-soft);stroke:var(--plan);stroke-width:1}
.t-question{fill:var(--question-soft);stroke:var(--question);stroke-width:1}
.t-stuck{fill:url(#cHatch2);stroke:var(--stuck);stroke-width:1}
.t-stuck.live{animation:blink 2.4s ease-in-out infinite}
.t-edge{fill:var(--busy-ink);animation:blink 2s ease-in-out infinite}
.t-now{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
.t-sub{fill:var(--idle)}
.t-sub.live{fill:var(--busy-ink)}
.t-mon{stroke:var(--idle-ink);stroke-width:1}
.t-axis text{font-size:12px;fill:var(--ink-2)}
.t-axis line{stroke:var(--line)}
.t-cost{fill:none;stroke:var(--ink-2);stroke-width:1.5}

/* history */

  const st = {busy:'busy', idle:'idle', plan:'plan waiting', question:'question', stuck:`stuck ${T(u.since, 'short')}`, blocked:'blocked'}[u.status];
  return `${STAGE_NAME[u.stage]} · <span class="s">${st}</span>`;
}
function planLegend() {
  return `<div class="legend">${['planned', 'coding', 'pr', 'review', 'merged', 'archived'].map(s => `<span><i class="sw stg-${s}"></i>${STAGE_NAME[s]}</span>`).join('')}<span class="note">Solid blue outline: can start now, because its parent branch has a PR open or is merged.</span></div>`;
}
function planTree() {
  const rows = [], pos = {};
  let leaf = 0;
  (function walk(id, depth) {
    const kids = PLAN_KIDS[id] || [];
    kids.forEach(k => walk(k, depth + 1));
    pos[id] = {depth, row: kids.length ? kids.reduce((a, k) => a + pos[k].row, 0) / kids.length : leaf++};
    rows.push(id);

}
function planGraphHtml(w) {
  const NW = 176, NH = 62, CX = 216, RY = 78, pos = planTree();
  const ids = Object.keys(pos), maxRow = Math.max(...ids.map(i => pos[i].row)), maxD = Math.max(...ids.map(i => pos[i].depth));

    return `<div class="pn stg-${u.stage} st-${u.status}${u.status === 'planned' && canStart(u) ? ' can' : ''}" style="left:${p.x}px;top:${p.y}px;width:${NW}px;height:${NH}px"${u.status !== 'planned' ? ` data-open="${id}" tabindex="0" role="button" aria-label="Open details for ${id}"` : ''}>
      <div class="pn-1"><span class="dot"></span>${id} ${esc(u.name)}</div><div class="pn-2">${planLine(u)}</div></div>`; }).join('');
  return `${planLegend()}<div class="plan-g" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" aria-hidden="true">${paths}</svg>${nodes}</div>`;
}
function planListHtml() {
  const out = [];
  (function walk(id, depth) { out.push([id, depth]); (PLAN_KIDS[id] || []).forEach(k => walk(k, depth + 1)); })('B0', 0);
  return `${planLegend()}<ol class="pl">${out.map(([id, d]) => { const u = M.byId[id];
    return `<li class="pl-row stg-${u.stage} st-${u.status}${u.status === 'planned' && canStart(u) ? ' can' : ''}" style="margin-left:${d * 16}px"${u.status !== 'planned' ? ` data-open="${id}" tabindex="0" role="button" aria-label="Open details for ${id}"` : ''}>
      <div class="pn-1"><span class="dot"></span>${id} ${esc(u.name)}</div><div class="pn-2">${planLine(u)}${u.dep ? ` · on ${u.dep}` : ''}</div></li>`; }).join('')}</ol>`;
}
function planDraw(el) {
  const host = el.querySelector('[data-plan]'); if (!host) return;
  const w = Math.floor(host.getBoundingClientRect().width);
  host.innerHTML = w >= 824 ? planGraphHtml(w) : planListHtml();
}

/* ---------- board: one column per stage ---------- */

}
function boardHtml() {

    return `<section class="bcol" aria-label="${STAGE_NAME[s]}"><div class="bcol-h"><i class="sw stg-${s}"></i><b>${STAGE_NAME[s]}</b>${us.length}</div>${us.map(miniCard).join('') || '<span class="none">None</span>'}</section>`; }).join('')}</div>`;

/* ---------- history (sample) ---------- */
const RUNS = [
  {id:'SA', name:'Sample story A', project:'sample-project', dates:'8 Oct 09:12 to 11 Oct 09:22', took:'72h 10m', busy:'105h 12m', cost:102510, merged:'15 of 16'},

  hours: 72.17,

    ['A3', 'API', 14.2, 41.0, 12.3, 11940, true], ['A4', 'jobs', 16.8, 35.5, 5.0, 5210, true], ['S1', 'security', 20.0, 47.0, 7.5, 7420, true], ['F2', 'forms', 27.3, 44.8, 5.9, 5730, true],
    ['D1', 'docs', 30.0, 40.5, 2.5, 2240, true], ['O1', 'alerts', 36.0, 48.0, 3.4, 3060, true], ['F3', 'tables', 41.2, 58.9, 7.0, 6910, true], ['I1', 'contract', 41.5, 60.2, 8.1, 7860, true],
    ['F4', 'charts', 45.0, 59.5, 4.6, 4120, true], ['O2', 'runbook', 48.4, 55.0, 1.6, 1540, true], ['P1', 'perf', 50.0, 66.0, 5.2, 5440, false], ['D2', 'guides', 58.0, 70.9, 2.0, 1870, true],
    ['I2', 'e2e', 60.5, 71.6, 6.0, 6450, true]],

  subs: [['task', 44, 14.33, 9800], ['code-review', 31, 9.83, 18900], ['explore', 22, 3.67, 6100], ['rubber-duck', 12, 2.08, 3400], ['research', 9, 4.17, 7200], ['general-purpose', 6, 3.25, 4100]],

const hm = h => dur(h * HOUR, 'hm');
function historyHtml() {
  return `<section class="sec" aria-label="Finished runs"><div class="sec-h"><h3>Finished runs</h3><span class="small muted">${RUNS.length} runs · sample data</span></div>
    <div class="h-list"><div class="h-row h-th"><span>Run</span><span>Dates</span><span>Took</span><span>Busy</span><span>Cost</span><span>Merged</span></div>
    ${RUNS.map(r => `<div class="h-row"${r.id ? ` data-run="${r.id}" tabindex="0" role="button" aria-label="Open the ${r.name} summary"` : ''}><span class="h-run"><span class="h-name">${esc(r.name)}</span><span class="small muted">${esc(r.project)}</span></span><span class="small muted">${r.dates}</span>
      <span class="h-cell"><span class="k">Took </span>${r.took}</span><span class="h-cell"><span class="k">Busy </span>${r.busy}</span><span class="h-cell">${costHtml(r.cost, true)}</span><span class="h-cell"><span class="k">Merged </span>${r.merged}</span></div>`).join('')}</div>
    <p class="small muted">Only Sample story A has a summary in this mockup.</p></section>`;
}
function runHtml() {
  const U = RUN_A.units, maxC = Math.max(...U.map(u => u[5])), ticks = [0, 12, 24, 36, 48, 60, 72];
  const gantt = U.map(([id, name, s, e, busy, cost, ok]) => `<div class="g-row"><div class="g-lab"><span>${id} ${esc(name)}</span><span class="small muted">busy ${hm(busy)}${ok ? '' : ', not merged'}</span></div>

      <div class="sec-h"><h3>Sample story A</h3><span class="small muted">sample-project · finished · sample data</span></div>
      <div class="run-answer"><div class="kv"><span class="k">Took, start to finish</span><span class="v l">72h 10m</span><span class="small muted">8 Oct 09:12 to 11 Oct 09:22</span></div>
        <div class="kv"><span class="k">Cost</span><span class="v l">${costHtml(102510, true)}</span><span class="small muted">orchestrator, 16 children and 124 sub-agents</span></div></div>

/* ---------- state, rendering, events ---------- */
const S = {page: 'live', tab: 'cards', detail: null, width: 'full'};
const TABS = {cards: 'Cards', activity: 'Activity', timeline: 'Timeline', plan: 'Plan', board: 'Board'};
const isNarrow = () => dash.clientWidth - 32 < 900;
let lastNarrow = null, lastW = 0;
function save() { try { sessionStorage.setItem('r2-state', JSON.stringify(S)); } catch (e) {} }
function tabBody(t) {
  if (t === 'cards') return cardsHtml();
  if (t === 'activity') return `<section class="rail" aria-label="Activity">${feedHtml(M.feed, 24)}</section>`;
  if (t === 'timeline') return timelineHtml();
  if (t === 'plan') return '<div data-plan></div>';
  return boardHtml();
}
function sideHtml() { return S.detail ? detailHtml(S.detail, false) : railHtml(); }
function bodyHtml(narrow) {
  const tabs = ['cards', ...(narrow ? ['activity'] : []), 'timeline', 'plan', 'board'];
  const main = narrow && S.detail ? detailHtml(S.detail, true)
    : `<div class="tabs" role="tablist" aria-label="Live views">${tabs.map(t => `<button type="button" role="tab" data-tab="${t}" aria-selected="${S.tab === t}">${TABS[t]}</button>`).join('')}</div><div class="tab-body">${tabBody(S.tab)}</div>`;
  return `<div class="d-body${narrow ? ' is-narrow' : S.detail ? ' has-detail' : ''}"><div class="d-main">${main}</div>${narrow ? '' : `<aside class="d-side">${sideHtml()}</aside>`}</div>`;
}
function topHtml() {
  const cur = S.page === 'run' ? 'history' : S.page;
  return `<div class="d-top"><div class="seg" role="group" aria-label="Dashboard">${['live', 'history'].map(p => `<button type="button" data-page="${p}" aria-pressed="${cur === p}">${p === 'live' ? 'Live' : 'History'}</button>`).join('')}</div><span class="small muted">Sample data · watch-only</span></div>`;
}
function afterRender() {
  const tb = dash.querySelector('.tab-body'); if (!tb) return;
  if (S.tab === 'timeline') timelineDraw(tb);
  if (S.tab === 'plan') planDraw(tb);
}
function render() {
  const narrow = isNarrow();
  if (!narrow && S.tab === 'activity') S.tab = 'cards';
  dash.innerHTML = topHtml() + (S.page === 'live' ? headHtml() + needsHtml() + bodyHtml(narrow) : S.page === 'history' ? historyHtml() : runHtml());
  lastNarrow = narrow; lastW = dash.clientWidth;
  root.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === preset()));
  afterRender(); save();
}
function preset() { return S.page !== 'live' ? S.page : S.detail ? 'detail' : S.tab === 'cards' ? 'live' : S.tab; }
function swap(el, html) {
  if (!el) return;
  const focusId = el.contains(document.activeElement) ? document.activeElement.dataset.open : null;
  const t = document.createElement('div'); t.innerHTML = html; const n = t.firstElementChild; el.replaceWith(n);
  if (focusId) { const f = dash.querySelector(`[data-open="${focusId}"]`); if (f) f.focus({preventScroll: true}); }
}
function refresh() {
  if (S.page !== 'live') return;
  const narrow = isNarrow();
  if (narrow !== lastNarrow) { render(); return; }
  swap(dash.querySelector('.d-head'), headHtml());
  const side = dash.querySelector('.d-side');
  if (side) swap(side.firstElementChild, sideHtml());
  if (narrow && S.detail) swap(dash.querySelector('.detail'), detailHtml(S.detail, true));
  const tb = dash.querySelector('.tab-body');
  if (tb && S.tab !== 'plan') { const f = tb.contains(document.activeElement) ? document.activeElement.dataset.open : null; tb.innerHTML = tabBody(S.tab); afterRender(); if (f) { const e = tb.querySelector(`[data-open="${f}"]`); if (e) e.focus({preventScroll: true}); } }
  M.all.forEach(k => { k.subs.forEach(s => { s.fresh = false; }); if (k.report) k.report.fresh = false; }); M.feed.forEach(f => { f.fresh = false; });
}
function go(p) {
  if (p === 'history' || p === 'run') { S.page = p; S.detail = null; }
  else { S.page = 'live'; S.detail = p === 'detail' ? 'I1' : null; S.tab = p === 'detail' || p === 'live' ? 'cards' : p; }
  render();
}
function setWidth(w) {
  S.width = w; stage.dataset.w = w;
  root.querySelectorAll('[data-w]').forEach(b => { if (b.closest('.mk-top')) b.setAttribute('aria-pressed', b.dataset.w === w); });
  render();
}
function act(t) {
  const el = t.closest('[data-w],[data-go],[data-page],[data-tab],[data-span],[data-close],[data-open],[data-run]'); if (!el || !root.contains(el)) return;
  if (el.dataset.w && el.closest('.mk-top')) setWidth(el.dataset.w);
  else if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.page) { S.page = el.dataset.page; S.detail = null; render(); }
  else if (el.dataset.tab) { S.tab = el.dataset.tab; render(); }
  else if (el.dataset.span) { TL.span = el.dataset.span; render(); }
  else if ('close' in el.dataset) { const was = S.detail; S.detail = null; render(); if (lastNarrow) dash.querySelector(`[data-open="${was}"]`)?.scrollIntoView({block: 'center'}); }
  else if (el.dataset.open) { S.detail = el.dataset.open; render(); if (lastNarrow) dash.querySelector('.detail')?.scrollIntoView({block: 'start'}); }
  else if (el.dataset.run) { S.page = 'run'; render(); }
}
root.addEventListener('click', e => act(e.target));
root.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-open],[role=button][data-run]')) { e.preventDefault(); act(e.target); } if (e.key === 'Escape' && S.detail) { S.detail = null; render(); } });
new ResizeObserver(() => requestAnimationFrame(() => {
  if (S.page !== 'live') { if (dash.clientWidth !== lastW) { lastW = dash.clientWidth; } return; }
  if (isNarrow() !== lastNarrow) render();
  else if (dash.clientWidth !== lastW) { lastW = dash.clientWidth; afterRender(); }
})).observe(dash);

/* ---------- simulation ---------- */
const REPS = {B1: ['Review fixes pushed', 'CI is green again', 'Comments resolved'], F2b: ['Edge cases added', 'Tests pass', 'Coverage at 84%']};
const feed = (u, x) => { M.feed.unshift({t: Date.now(), u, x, fresh: true}); M.feed.length = Math.min(M.feed.length, 40); };
function cost(id, d = 40 + Math.floor(Math.random() * 120)) { M.byId[id].cost += d; refresh(); }
function subStart(id, type, model, task) {
  const s = M.byId[id], sb = {id: 's' + (++uid), type, model, mode: 'bg', started: Date.now(), ended: null, cost: 0, task, fresh: true};
  s.subs.push(sb); s.hist.subs.push({id: sb.id, s: sb.started, e: null, type}); feed(id, `started ${type}: ${task[0].toLowerCase() + task.slice(1)}`); refresh();
}
function subEnd(id, idx, note) {
  const s = M.byId[id], sb = s.subs[idx]; if (!sb) return;
  s.subs.splice(idx, 1); sb.ended = Date.now(); sb.cost = 120 + Math.floor(Math.random() * 600); s.cost += sb.cost;
  (s.past = s.past || []).unshift(sb); const h = s.hist.subs.find(x => x.id === sb.id); if (h) h.e = sb.ended;
  feed(id, `${sb.type} finished${note ? ': ' + note : ''}`); refresh();
}
function report(id, text) {
  const s = M.byId[id];
  s.report = {...s.report, st: 'complete', text, t: Date.now(), fresh: true, summary: `${text}. Continuing with the next step.`, evidence: ['Tests pass on the branch', 'Pushed to the PR branch'], blockers: []};
  s.progress = Math.min(95, s.progress + 4 + Math.floor(Math.random() * 4)); s.since = s.since; s.activity = {...s.activity, last: Date.now()};
  s.hist.marks.push({t: Date.now(), k: 'report', st: 'complete', text}); feed(id, `reported complete: ${text.toLowerCase()}`); refresh();
}
function monitorTick() {
  for (const k of M.units) { const m = k.monitor; if (m.state !== 'alive' || Date.now() < m.next) continue;
    m.last = Date.now(); m.next = m.last + m.every * MIN; k.activity = {...k.activity, last: m.last};
    k.hist.marks.push({t: m.last, k: 'monitor', text: 'PR monitor check'}); feed(k.id, `PR monitor checked #${k.pr.n}: no new comments`); refresh(); }
}
const timers = [];
const at = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));
function script() {
  at(3, () => subEnd('B1', 1, 'API tests, 212 passed'));
  at(8, () => cost('B1'));
  at(12, () => subEnd('SB', 0, 'DataGrid fits, with 2 caveats'));
  at(18, () => cost('F2b'));
  at(24, () => report('B1', 'Review fixes pushed'));
  at(30, () => subEnd('F2b', 0, '2 gaps in the test plan'));
  at(36, () => subStart('SB', 'general-purpose', 'claude-sonnet-5', 'Draft the F1 answer'));
  at(44, () => cost('SB'));
  at(52, () => report('F2b', 'Edge cases added'));
  at(60, ambient);
}
function ambient() {
  const busy = M.all.filter(s => s.status === 'busy'), s = busy[Math.floor(Math.random() * busy.length)], r = Math.random(), cap = {SB: 2, B1: 2, F2b: 1};
  if (r < 0.55) cost(s.id);
  else if (r < 0.7 && s.subs.length < cap[s.id]) subStart(s.id, ['task', 'explore', 'code-review'][Math.floor(Math.random() * 3)], 'claude-haiku-5.5', 'Background check');
  else if (r < 0.85 && s.subs.length > (s.id === 'F2b' ? 0 : 1)) subEnd(s.id, 0);
  else if (s.id !== 'SB' && Date.now() - s.report.t > 45e3) { const p = REPS[s.id]; report(s.id, p[Math.floor(Math.random() * p.length)]); }
  timers.push(setTimeout(ambient, 6000 + Math.random() * 4000));
}

/* ---------- start ---------- */
M = build();
try { const sv = JSON.parse(sessionStorage.getItem('r2-state') || 'null'); if (sv) Object.assign(S, sv); } catch (e) {}
stage.dataset.w = S.width;
root.querySelectorAll('.mk-top [data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === S.width));
render();
setInterval(() => { tick(); monitorTick(); }, 1000);
if (!RM) script();
})();
</script>
